                  enum:
                    - 0
                    - 1
                password:
                  description: 'New password'
                  type: string
                  example: NewPass456!
                email:
                  description: 'Notification email (null to remove)'
                  type: string
                  format: email
                  example: notify@example.com
                  nullable: true
                newlogin:
                  description: 'New login name — must use a customer-owned domain after @'
                  type: string
                  format: email
                  example: newlogin@myowneddomain.com
                otp:
                  description: 'TOTP secret to activate, or 0 to deactivate'
                  example: JBSWY3DPEHPK3PXP
                roles:
                  description: 'Role IDs or names to assign (replaces existing)'
                  type: array
                  items:
                    example: 1
                domains:
                  description: 'Domain IDs to grant access to (replaces existing)'
                  type: array
                  items:
                    type: integer
                    example: 42
                permissions:
                  description: 'Type of permission update to perform'
                  type: string
                  enum:
                    - cust_mod
                    - type
                    - domain
                perm:
                  description: 'Module names to assign (used with permissions=cust_mod or permissions=domain)'
                  type: array
                  items:
                    type: string
                    example: DNS
                permission-type:
                  description: 'Permission type preset (used with permissions=type)'
                  type: string
                  example: DEFAULT
                IDdomeny:
                  description: 'Domain ID for domain-level permissions (used with permissions=domain)'
                  type: integer
                  example: 42
                invert:
                  description: 'Any value — toggles account active/inactive'
                  type: string

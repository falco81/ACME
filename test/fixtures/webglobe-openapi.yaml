  '/reg/contacts/{contact}/transfer':
    post:
      tags:
        - 'Registrant Contacts'
      summary: 'Transfer an already-imported registrant contact'
      description: 'Attaches a registry auth code (authinfo) to an already-imported, REGISTERED registrant contact and marks it for transfer (status TO_TRANSFER). Currently supported only for contacts registered at cznic (.cz) that are not yet owned by us in the registry (isOur() false).'
      operationId: regContactsTransfer
      parameters:
        -
          name: contact
          in: path
          description: 'Local contact id (IDregistrant)'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - auth_code
              properties:
                auth_code:
                  description: 'Registry transfer auth code (authinfo) for the contact.'
                  type: string
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - success
                  - status
                  - contact_id
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  contact_id:
                    type: integer
                    example: 12345
                type: object
        400:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                missing_auth_code:
                  summary: 'Auth code missing'
                  value:
                    success: false
                    error:
                      message: 'Auth code is required for a contact transfer.'
                      code: 1401
                unauthorized:
                  summary: 'Contact not found / not owned by you'
                  value:
                    success: false
                    error:
                      message: 'Unauthorized access.'
                      code: 64
                not_cznic:
                  summary: 'Contact register is not cznic'
                  value:
                    success: false
                    error:
                      message: 'Transfer contact is available only for cznic register.'
                      code: 1301
                wrong_status:
                  summary: 'Contact status is not REGISTERED'
                  value:
                    success: false
                    error:
                      message: "This contact can't be transferred at this moment."
                      code: 1169
                no_handle:
                  summary: 'Contact has no registry handle'
                  value:
                    success: false
                    error:
                      message: 'Contact has no registry handle to transfer.'
                      code: 1402
                registry_contact_missing:
                  summary: 'Contact does not exist in the registry'
                  value:
                    success: false
                    error:
                      message: 'Contact does not exist.'
                      code: 1170
                registry_error:
                  summary: 'Problem retrieving data from the registry'
                  value:
                    success: false
                    error:
                      message: 'Problem with retrieving the data from the Registry.'
                      code: 1171
                already_ours:
                  summary: 'Contact is already ours, transfer not needed'
                  value:
                    success: false
                    error:
                      message: 'Contact is already ours, transfer is not needed.'
                      code: 1403
      security:
        -
          bearerAuth: []

        phpVersion:
          description: 'PHP version on domain or subdomain'
          type: string
          example: php72
        graphsAvailable:
          description: 'The domain has the ability to display graphs'
          type: boolean
          example: 'true'
      type: object
    CustomerDomainPhpVersionResponse:
      description: 'Response containing information domain with PHP Extended Support'
      required:
        - domainId
        - domainName
        - phpVersion
      properties:
        domainId:
          description: 'Domain ID'
          type: integer
          example: '12351'
        domainName:
          description: 'Domain name or subdomain name'
          type: string
          example: example.com
        phpVersion:
          description: 'PHP version on domain or subdomain'
          type: string
          example: php72
      type: object
    CustomerDomainsPhpVersionPaginatedResponse:
      description: 'Paginated response containing information about domains with PHP versions'

                    example: 5
                  registrants:
                    description: 'Paginated data'
                    properties:
                      data:
                        type: array
                        items:
                          properties:
                            contact_id:
                              type: integer
                              example: 12345
                            single_tld:
                              type: string
                              example: sk
                            status:
                              type: string
                              example: REGISTERED
                            cookie_value:
                              description: 'Registry handle'
                              type: string
                              example: WEBG-0001
                              nullable: true
                            type:
                              type: string
                              enum:
                                - REGISTRANT
                                - BILL
                                - ADMIN
                                - TECH
                                - LOCAL
                            registered_in:
                              type: string
                              nullable: true
                            title:
                              description: 'Company name or contact name'
                              type: string
                              nullable: true
                          type: object
                    type: object
                  supported_toplevels:
                    type: array
                    items:
                      type: string
                  automated_registers:
                    type: array
                    items:
                      type: string
                    example:
                      - sknic
                      - eurid
                      - joker
                      - subreg
                      - cznic
                      - rrpproxy
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'Registrant Contacts'
      summary: 'Create or import a contact'
      description: 'Send `action=import` with `nic_id`/`register`/`tld`/`auth_code` to import an existing registry contact by handle (or request its transfer, cznic only, when auth_code is given). Otherwise creates a new local contact from `contact_data`, optionally reserving a specific `req_registrant_id` handle (sk/cz only).'
      operationId: contacts.store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                action:
                  description: 'Set to "import" to import an existing registry contact instead of creating a new one'
                  type: string
                  nullable: true
                  enum:
                    - import
                nic_id:
                  description: 'Registry handle to import (action=import only)'
                  type: string
                  nullable: true
                register:
                  description: 'Register to import from when action=import (guessed from tld if omitted), or automated register to create the new contact in'
                  type: string
                  nullable: true
                  enum:
                    - sknic
                    - eurid
                    - joker
                    - subreg
                    - cznic
                    - rrpproxy
                tld:
                  description: 'TLD of the imported contact (action=import only, default cz)'
                  type: string
                  nullable: true
                auth_code:
                  description: 'Auth code to request a transfer instead of a plain import (action=import, cznic only)'
                  type: string
                  nullable: true
                req_registrant_id:
                  description: 'Requested registry handle to reserve for the new contact (sk/cz only)'
                  type: string
                  nullable: true
                contact_data:
                  oneOf:
                    -
                      $ref: '#/components/schemas/RegContactData'
                    -
                      type: object
                      nullable: true
                      enum:
                        - null
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  contact_id:
                    type: integer
                    example: 12345
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/reg/contacts/{contact}':
    get:
      tags:
        - 'Registrant Contacts'
      summary: 'Get a contact'
      description: 'Returns local contact data plus, for contacts held at an automated register, a live copy fetched from the registry (`contact_nic`) and the registry field mask (`mask`).'
      operationId: contacts.show
      parameters:
        -
          name: contact
          in: path
          description: 'Contact ID'
          required: true
          schema:
            type: integer
            example: 12345
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  mask:
                    oneOf:
                      -
                        $ref: '#/components/schemas/RegContactData'
                      -
                        type: object
                        nullable: true
                        enum:
                          - null
                    description: 'Registry field mask with supported_countries, null when not applicable or on registry error'
                  supported_toplevels:
                    type: array
                    items:
                      type: string
                  contact:
                    $ref: '#/components/schemas/RegContactData'
                  contact_nic:
                    oneOf:
                      -
                        $ref: '#/components/schemas/RegContactData'
                      -
                        type: object
                        nullable: true
                        enum:
                          - null
                    description: 'Live data fetched from the registry (automated registers only), null otherwise'
                  handle:
                    description: 'Registry handle'
                    type: string
                    nullable: true
                  status:
                    type: string
                    example: REGISTERED
                  contact_id:
                    type: integer
                    example: 12345
                  request:
                    description: 'Pending change/register/delete request, null when none'
                    properties:
                      request_id:
                        type: integer
                        example: 5555
                      request_type:
                        type: string
                        example: CONTACT_CHANGE
                    type: object
                    nullable: true
                  automated_registers:
                    type: array
                    items:
                      type: string
                    example:
                      - sknic
                      - eurid
                      - joker
                      - subreg
                      - cznic
                      - rrpproxy
                  transferable:
                    description: 'Whether the contact could be transferred to us; null when there is no live registry data to decide from.'
                    type: boolean
                    nullable: true
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - 'Registrant Contacts'
      summary: 'Update a contact'
      description: 'Dispatches one of several distinct actions depending on `part`. `send_authid` = re-send the authorization e-mail for a pending automated-register update (no other fields needed). `cancel_request` = cancel a pending request identified by `request_id`. Omitted/other = update `contact_data` at the automated register; requires `approve_by`, and `approve_notary_email` when approve_by=NOTARY.'
      operationId: contacts.update
      parameters:
        -
          name: contact
          in: path
          description: 'Contact ID'
          required: true
          schema:
            type: integer
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                part:
                  description: 'Which action to perform'
                  type: string
                  nullable: true
                  enum:
                    - send_authid
                    - cancel_request
                request_id:
                  description: 'Pending request (todo) ID to cancel (part=cancel_request only)'
                  type: integer

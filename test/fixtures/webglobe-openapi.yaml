  '/{domainId}/ftpaccount':
    get:
      tags:
        - 'FTP Accounts'
      summary: 'Get FTP accounts'
      description: "Returns the domain's main FTP account together with its subaccounts, quota usage and whether a new FTP account can still be created (limited by the FTP_count domain variable)."
      operationId: ftpaccount.index
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      responses:
        200:
          description: 'Main FTP account with its subaccounts'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  data:
                    properties:
                      main:
                        properties:
                          userid:
                            description: 'FTP login name'
                            type: string
                            example: ftpaccount.example.com
                          uid:
                            type: integer
                            example: 9999
                          gid:
                            type: integer
                            example: 514
                          homedir:
                            type: string
                            example: /home/example.com
                          masterid:
                            type: string
                            example: null
                            nullable: true
                          enabled:
                            type: integer
                            example: 1
                            enum:
                              - 0
                              - 1
                          server:
                            type: string
                            example: ftp1
                          deleted:
                            type: integer
                            example: 0
                            enum:
                              - 0
                              - 1
                          ssh:
                            type: integer
                            example: 0
                            enum:
                              - 0
                              - 1
                          quota:
                            description: 'Quota in bytes (0 = unlimited/not set)'
                            type: integer
                            example: 1073741824
                          used:
                            description: 'Used space in bytes'
                            type: integer
                            example: 52428800
                          subaccounts:
                            type: array
                            items:
                              properties:
                                userid:
                                  type: string
                                  example: subuser.example.com
                                homedir:
                                  type: string
                                  example: /home/example.com/sub
                                masterid:
                                  type: string
                                  example: ftpaccount.example.com
                                enabled:
                                  type: integer
                                  example: 1
                                  enum:
                                    - 0
                                    - 1
                                is_domain_ftp:
                                  description: 'True if this subaccount is the main FTP account of another domain'
                                  type: boolean
                                  example: false
                                quota:
                                  type: integer
                                  example: 0
                                used:
                                  type: integer
                                  example: 0
                              type: object
                        type: object
                      cancreate:
                        description: 'Whether another FTP account can be created under the FTP_count limit'
                        type: boolean
                        example: true
                      FTP_max_count:
                        description: 'Maximum number of FTP accounts allowed for this domain'
                        type: integer
                        example: 5
                    type: object
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'FTP Accounts'
      summary: 'Create FTP account'
      description: "Creates a new FTP subaccount under the domain's main FTP account. The login name is built as `{name}.{domain}`. The subpath must resolve under the main account's home directory. Optional quota (in MB) is checked against the available quota of the main FTP account, and optional command limits restrict which FTP commands the subaccount may use."
      operationId: ftpaccount.store
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'Login name prefix, combined with the domain name to build the full login'
                  type: string
                  example: subuser
                subpath:
                  description: "Directory relative to the main account's home directory"
                  type: string
                  example: public_html/sub
                password:
                  type: string
                  example: S3curePassword!
                quota:
                  description: 'Quota in MB (0 or omitted = no explicit quota)'
                  type: integer
                  example: 500
                limits:
                  description: 'Allowed FTP commands. Omit or leave empty for no restrictions.'
                  type: array
                  items:
                    type: string
                    enum:
                      - read
                      - write
                      - dele
                      - list
                      - cwd
                      - mkd
                      - rmd
                      - all
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/{domainId}/ftpaccount/{ftpaccount}':
    get:
      tags:
        - 'FTP Accounts'
      summary: 'Get FTP account detail'
      description: "Returns detail of a single FTP account (main or subaccount) including its allowed IPs, allowed GeoIP countries and current FTP command limits. The account must belong to the same customer as the domain's main FTP account."
      operationId: ftpaccount.show
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: ftpaccount
          in: path
          description: 'FTP account login name (userid)'
          required: true
          schema:
            type: string
            example: subuser.example.com
      responses:
        200:
          description: 'FTP account detail'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  data:
                    properties:
                      userid:
                        type: string
                        example: subuser.example.com
                      uid:
                        type: integer
                        example: 9999
                      gid:
                        type: integer
                        example: 514
                      homedir:
                        type: string
                        example: /home/example.com/sub
                      masterid:
                        type: string
                        example: ftpaccount.example.com
                        nullable: true
                      enabled:
                        type: integer
                        example: 1
                        enum:
                          - 0
                          - 1
                      server:
                        type: string
                        example: ftp1
                      deleted:
                        type: integer
                        example: 0
                        enum:
                          - 0
                          - 1
                      ssh:
                        type: integer
                        example: 0
                        enum:
                          - 0
                          - 1
                      ips:
                        description: 'Allowed IP ranges for this FTP account'
                        type: array
                        items:
                          type: object
                      geoip:
                        description: 'Allowed countries for this FTP account'
                        type: array
                        items:
                          type: object
                    type: object
                  limit:
                    description: 'Currently configured FTP command limits for this account'
                    type: array
                    items:
                      type: string
                      enum:
                        - read
                        - write
                        - dele
                        - list
                        - cwd
                        - mkd
                        - rmd
                        - all
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - 'FTP Accounts'
      summary: 'Update FTP account'
      description: "Updates an FTP account (main or subaccount). All fields are optional, each triggers an independent action: `invert` (any value) toggles enabled/disabled; `password` changes the password; `quota` changes the quota in MB (checked against the main account's available quota); `subpath` moves the home directory (relative to the main account's home directory, refused if it would delete the main FTP account of another domain in a multihosting group); `limits` updates the allowed FTP commands."
      operationId: ftpaccount.update
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: ftpaccount
          in: path
          description: 'FTP account login name (userid)'
          required: true
          schema:
            type: string
            example: subuser.example.com
      requestBody:
        content:
          application/json:
            schema:
              properties:
                invert:
                  description: 'Any value - toggles the account between enabled and disabled'
                  type: string
                  example: '1'
                password:
                  description: 'New password'
                  type: string
                  example: N3wPassword!
                quota:
                  description: 'New quota in MB'
                  type: integer
                  example: 500
                subpath:
                  description: "New directory relative to the main account's home directory. Empty string is allowed (resets to the home directory)."
                  type: string
                  example: public_html/newsub
                limits:
                  description: 'Allowed FTP commands, replaces the current limits.'
                  type: array
                  items:
                    type: string
                    enum:
                      - read
                      - write
                      - dele
                      - list
                      - cwd
                      - mkd
                      - rmd
                      - all
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - 'FTP Accounts'
      summary: 'Delete FTP account'
      description: "Deletes an FTP subaccount. The account must be a subaccount of the domain's main FTP account. Refused if the domain is part of a multihosting group and the account is the main FTP account of another domain in that group."
      operationId: ftpaccount.destroy
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: ftpaccount
          in: path
          description: 'FTP account login name (userid)'
          required: true
          schema:
            type: string
            example: subuser.example.com
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []

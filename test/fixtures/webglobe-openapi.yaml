openapi: 3.0.0
info:
  title: 'Webglobe API'
  description: "API documentation for administration services in Webglobe systems.\n\nAll authorized requests require **`JWT`**.\n\nThis manual provides an overview of commands which can be used for communication with the system. Please read it carefully. If you find any mistake or missing information, contact us immediately.\n\nAPI is based on RESTful Web Services and uses these http methods:\n- GET\n- PUT\n- POST\n- DELETE\n\n\nWe highly recommend testing against our staging environment before using our production environment.\n"
  contact:
    email: info@webglobe.com
  version: '1.0'
servers:
  -
    url: ''
    description: 'Current server'
  -
    url: 'https://api.staging.core.webglobe.com/'
    description: 'Staging server'
  -
    url: 'https://api.webglobe.com/'
    description: 'Production server'
paths:
  '/{domainId}/cron':
    get:
      tags:
        - Cron
      summary: 'List cron jobs'
      description: 'Returns a paginated list of scheduled (cron) tasks for the domain, ordered by url, type or value.'
      operationId: cron.index
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: per_page
          in: query
          description: 'Items per page'
          schema:
            type: integer
            default: 20
        -
          name: order
          in: query
          description: 'Sort as "<column> <ASC|DESC>", column one of IDinvoice, url, type, value. Falls back to "url ASC" when invalid.'
          schema:
            type: string
            default: 'url ASC'
        -
          name: url
          in: query
          description: 'Filter by url (LIKE match)'
          schema:
            type: string
      responses:
        200:
          description: 'Paginated cron job list'
          content:
            application/json:
              schema:
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          type: integer
                          example: 123
                        IDdomeny:
                          type: integer
                          example: 456
                        name:
                          type: string
                          example: 'Backup task'
                        url:
                          type: string
                          example: 'https://example.com/cron.php'
                        user:
                          type: string
                          example: ''
                          nullable: true
                        password:
                          type: string
                          example: ''
                          nullable: true
                        email:
                          type: string
                          format: email
                          example: ''
                          nullable: true
                        type:
                          type: string
                          example: INTERVAL
                          enum:
                            - INTERVAL
                            - DAILY
                            - WEEKLY
                            - CRONTAB
                        value:
                          description: 'Raw stored value, format depends on type'
                          type: string
                          example: '60'
                        last_run:
                          type: string
                          format: date-time
                          example: '2026-08-01 00:00:00'
                          nullable: true
                        note:
                          type: string
                          example: ''
                          nullable: true
                        run_now:
                          type: integer
                          example: 0
                          enum:
                            - 0
                            - 1
                        disabled:
                          type: integer
                          example: 0
                          enum:
                            - 0
                            - 1
                        running:
                          type: integer
                          example: 0
                          enum:
                            - 0
                            - 1
                        last_tried_run:
                          type: string
                          format: date-time
                          example: null
                          nullable: true
                        empty_mail:
                          type: integer
                          example: 0
                          nullable: true
                          enum:
                            - 0
                            - 1
                        interval:
                          description: 'Present only when type=INTERVAL, minutes between runs'
                          type: integer
                          example: 60
                        time:
                          description: 'Present only when type=DAILY/WEEKLY, last run time HH:mm'
                          type: string
                          example: '03:00'
                        day:
                          description: 'Present when type=WEEKLY (weekday index) or type=CRONTAB (day-of-month field)'
                          type: string
                          example: '1'
                        minute:
                          description: 'Present only when type=CRONTAB'
                          type: string
                          example: '0'
                        hour:
                          description: 'Present only when type=CRONTAB'
                          type: string
                          example: '3'
                        month:
                          description: 'Present only when type=CRONTAB'
                          type: string
                          example: '*'
                        day_of_week:
                          description: 'Present only when type=CRONTAB'
                          type: string
                          example: '*'
                      type: object
                  last_page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 3
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Cron
      summary: 'Create cron job'
      description: 'Creates a new scheduled (cron) task for the domain. The domain''s CRON_max_tasks setting limits how many tasks may exist (default 10). The target URL is checked with an HTTP HEAD request before saving, unless the domain''s CRON_check_url setting is "Nie".'
      operationId: cron.store
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'Optional label for the task'
                  type: string
                  example: 'Backup task'
                url:
                  description: 'URL to call'
                  type: string
                  format: uri
                  example: 'https://example.com/cron.php'
                user:
                  description: 'HTTP basic auth username, optional'
                  type: string
                  example: ''
                password:
                  description: 'HTTP basic auth password, optional'
                  type: string
                  example: ''
                email:
                  description: 'Notification email, optional'
                  type: string
                  format: email
                  example: ''
                empty_mail:
                  description: 'When set, notification is sent even for empty responses'
                  type: string
                  example: ''
                note:
                  description: 'Free text note'
                  type: string
                  example: ''
                type:
                  description: 'Schedule type'
                  type: string
                  example: INTERVAL
                  enum:
                    - INTERVAL
                    - DAILY
                    - WEEKLY
                    - CRONTAB
                value_int:
                  description: 'Interval in minutes (required when type=INTERVAL); one of 1, 5, 15, 30, 60, 120, 300, 720, 1440, 2880, 5760, 10080, 20160, 43200'
                  type: integer
                  example: 60
                value_daily:
                  description: 'Run time as HH:MM (required when type=DAILY)'
                  type: string
                  example: '03:00'
                value_weekly:
                  description: 'Run time as HH:MM (required when type=WEEKLY)'
                  type: string
                  example: '03:00'
                day:
                  description: 'Day of week, 0 (Sunday) - 6 (Saturday) (required when type=WEEKLY)'
                  type: integer
                  example: 1
                crontabdata:
                  description: 'Crontab fields (required when type=CRONTAB)'
                  properties:
                    minute:
                      type: string
                      example: '0'
                    hour:
                      type: string
                      example: '3'
                    day:
                      type: string
                      example: '*'
                    month:
                      type: string
                      example: '*'
                    dayofweek:
                      type: string
                      example: '*'
                  type: object
              type: object
            examples:
              interval:
                summary: 'type=INTERVAL - run every N minutes'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "INTERVAL", "value_int": 60}'
              daily:
                summary: 'type=DAILY - run once a day at a given time'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "DAILY", "value_daily": "03:00"}'
              weekly:
                summary: 'type=WEEKLY - run once a week on a given day and time'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "WEEKLY", "value_weekly": "03:00", "day": 1}'
              crontab:
                summary: 'type=CRONTAB - run on a custom crontab schedule'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "CRONTAB", "crontabdata": {"minute": "0", "hour": "3", "day": "*", "month": "*", "dayofweek": "*"}}'
      responses:
        200:
          description: 'Cron job created'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  new_id:
                    type: integer
                    example: 123
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/{domainId}/cron/{cron}':
    get:
      tags:
        - Cron
      summary: 'Get cron job run logs'
      description: 'Returns a paginated list of run logs for the given cron job, optionally filtered by HTTP status code, start time range or total run time range.'
      operationId: cron.show
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: cron
          in: path
          description: 'Cron job ID'
          required: true
          schema:
            type: integer
            example: 123
        -
          name: per_page
          in: query
          description: 'Items per page'
          schema:
            type: integer
            default: 20
        -
          name: 'filter[http_code]'
          in: query
          description: 'Filter logs by exact HTTP status code'
          schema:
            type: integer
            example: 200
        -
          name: 'filter[start_from]'
          in: query
          description: 'Filter logs with start >= this datetime'
          schema:
            type: string
            format: date-time
        -
          name: 'filter[start_till]'
          in: query
          description: 'Filter logs with start <= this datetime'
          schema:
            type: string
            format: date-time
        -
          name: 'filter[time_from]'
          in: query
          description: 'Filter logs with total_time >= this value (seconds)'
          schema:
            type: number
            format: float
        -
          name: 'filter[time_till]'
          in: query
          description: 'Filter logs with total_time <= this value (seconds)'
          schema:
            type: number
            format: float
      responses:
        200:
          description: 'Paginated cron job run logs'
          content:
            application/json:
              schema:
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          type: integer
                          example: 1
                        cron_id:
                          type: integer
                          example: 123
                        type:
                          type: string
                          example: OK
                        start:
                          type: string
                          format: date-time
                          example: '2026-08-01 03:00:00'
                        end:
                          type: string
                          format: date-time
                          example: '2026-08-01 03:00:02'
                          nullable: true
                        planned:
                          type: string
                          format: date-time
                          example: '2026-08-01 03:00:00'
                        url:
                          type: string
                          example: 'https://example.com/cron.php'
                        http_code:
                          type: integer
                          example: 200
                        total_time:
                          type: number
                          format: float
                          example: 1.23
                        size_downloaded:
                          type: integer
                          example: 512
                      type: object
                  last_page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 1
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Cron
      summary: 'Update cron job'
      description: '`run`, `enable` and `disable` are applied independently (any truthy value triggers the action) and each is saved immediately. When both `url` and `type` are filled, the full task definition is replaced (same fields and validation as creating a cron job), including a fresh URL check unless the domain''s CRON_check_url setting is "Nie".'
      operationId: cron.update
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: cron
          in: path
          description: 'Cron job ID'
          required: true
          schema:
            type: integer
            example: 123
      requestBody:
        content:
          application/json:
            schema:
              properties:
                run:
                  description: 'Any value - marks the task to run immediately (sets run_now=1)'
                  type: string
                  example: '1'
                enable:
                  description: 'Any value - enables the task (sets disabled=0)'
                  type: string
                  example: '1'
                disable:
                  description: 'Any value - disables the task (sets disabled=1)'
                  type: string
                  example: '1'
                name:
                  description: 'Optional label for the task'
                  type: string
                  example: 'Backup task'
                url:
                  description: 'URL to call (together with type, replaces the full task definition)'
                  type: string
                  format: uri
                  example: 'https://example.com/cron.php'
                user:
                  description: 'HTTP basic auth username, optional'
                  type: string
                  example: ''
                password:
                  description: 'HTTP basic auth password, optional'
                  type: string
                  example: ''
                email:
                  description: 'Notification email, optional'
                  type: string
                  format: email
                  example: ''
                empty_mail:
                  description: 'When set, notification is sent even for empty responses'
                  type: string
                  example: ''
                note:
                  description: 'Free text note'
                  type: string
                  example: ''
                type:
                  description: 'Schedule type'
                  type: string
                  example: INTERVAL
                  enum:
                    - INTERVAL
                    - DAILY
                    - WEEKLY
                    - CRONTAB
                value_int:
                  description: 'Interval in minutes (required when type=INTERVAL); one of 1, 5, 15, 30, 60, 120, 300, 720, 1440, 2880, 5760, 10080, 20160, 43200'
                  type: integer
                  example: 60
                value_daily:
                  description: 'Run time as HH:MM (required when type=DAILY)'
                  type: string
                  example: '03:00'
                value_weekly:
                  description: 'Run time as HH:MM (required when type=WEEKLY)'
                  type: string
                  example: '03:00'
                day:
                  description: 'Day of week, 0 (Sunday) - 6 (Saturday) (required when type=WEEKLY)'
                  type: integer
                  example: 1
                crontabdata:
                  description: 'Crontab fields (required when type=CRONTAB)'
                  properties:
                    minute:
                      type: string
                      example: '0'
                    hour:
                      type: string
                      example: '3'
                    day:
                      type: string
                      example: '*'
                    month:
                      type: string
                      example: '*'
                    dayofweek:
                      type: string
                      example: '*'
                  type: object
              type: object
            examples:
              run:
                summary: 'Run the task immediately'
                value: '{"run": 1}'
              enable:
                summary: 'Enable the task'
                value: '{"enable": 1}'
              disable:
                summary: 'Disable the task'
                value: '{"disable": 1}'
              interval:
                summary: 'type=INTERVAL - replace with a run-every-N-minutes schedule'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "INTERVAL", "value_int": 60}'
              daily:
                summary: 'type=DAILY - replace with a once-a-day schedule'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "DAILY", "value_daily": "03:00"}'
              weekly:
                summary: 'type=WEEKLY - replace with a once-a-week schedule'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "WEEKLY", "value_weekly": "03:00", "day": 1}'
              crontab:
                summary: 'type=CRONTAB - replace with a custom crontab schedule'
                value: '{"name": "Backup task", "url": "https://example.com/cron.php", "type": "CRONTAB", "crontabdata": {"minute": "0", "hour": "3", "day": "*", "month": "*", "dayofweek": "*"}}'
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Cron
      summary: 'Delete cron job'
      description: 'Deletes the given cron job.'
      operationId: cron.destroy
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: cron
          in: path
          description: 'Cron job ID'
          required: true
          schema:
            type: integer
            example: 123
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/{domainId}/cron/{cron}/edit':
    get:
      tags:
        - Cron
      summary: 'Get cron job details for editing'
      description: 'Returns the raw cron job record, for pre-filling an edit form.'
      operationId: cron.edit
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: cron
          in: path
          description: 'Cron job ID'
          required: true
          schema:
            type: integer
            example: 123
      responses:
        200:
          description: 'Cron job details'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  data:
                    properties:
                      id:
                        type: integer
                        example: 123
                      IDdomeny:
                        type: integer
                        example: 456
                      name:
                        type: string
                        example: 'Backup task'
                      url:
                        type: string
                        example: 'https://example.com/cron.php'
                      user:
                        type: string
                        example: ''
                        nullable: true
                      password:
                        type: string
                        example: ''
                        nullable: true
                      email:
                        type: string
                        format: email
                        example: ''
                        nullable: true
                      type:
                        type: string
                        example: INTERVAL
                        enum:
                          - INTERVAL
                          - DAILY
                          - WEEKLY
                          - CRONTAB
                      value:
                        description: 'Raw stored value, format depends on type'
                        type: string
                        example: '60'
                      last_run:
                        type: string
                        format: date-time
                        example: '2026-08-01 00:00:00'
                        nullable: true
                      note:
                        type: string
                        example: ''
                        nullable: true
                      run_now:
                        type: integer
                        example: 0
                        enum:
                          - 0
                          - 1
                      disabled:
                        type: integer
                        example: 0
                        enum:
                          - 0
                          - 1
                      running:
                        type: integer
                        example: 0
                        enum:
                          - 0
                          - 1
                      last_tried_run:
                        type: string
                        format: date-time
                        example: null
                        nullable: true
                      empty_mail:
                        type: integer
                        example: 0
                        nullable: true
                        enum:
                          - 0
                          - 1
                    type: object
                    nullable: true
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/{domainId}/ssl/own-certificate':
    post:
      tags:
        - SSL
      summary: "Store user's own SSL certificate for a domain"
      description: 'Available only for customers with purchased paid support. Otherwise the request is rejected with error code 3 (Access to requested module is denied).'
      operationId: sslStoreOwnCertificate
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - certificate
                - private_key
                - chain
              properties:
                certificate:
                  description: 'The SSL certificate in PEM format.'
                  type: string
                private_key:
                  description: 'The private key corresponding to the SSL certificate in PEM format.'
                  type: string
                chain:
                  description: 'The certificate chain in PEM format.'
                  type: string
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SslValidateOwnCertificateResponse'
        400:
          $ref: '#/components/responses/Error'
  '/{domainId}/ssl/validate':
    post:
      tags:
        - SSL
      summary: "Validate user's own SSL certificate for a domain"
      description: 'Available only for customers with purchased paid support. Otherwise the request is rejected with error code 3 (Access to requested module is denied).'
      operationId: sslValidateOwnCertificate
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - certificate
                - private_key
                - chain
              properties:
                certificate:
                  description: 'The SSL certificate in PEM format.'
                  type: string
                private_key:
                  description: 'The private key corresponding to the SSL certificate in PEM format.'
                  type: string
                chain:
                  description: 'The certificate chain in PEM format.'
                  type: string
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SslValidateOwnCertificateResponse'
        400:
          $ref: '#/components/responses/Error'
  '/{domainId}/ssl/create':
    get:
      tags:
        - SSL
      summary: 'Get information for create SSL certificate'
      operationId: sslCreate
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    description: 'true if request was successful'
                    type: boolean
                  status:
                    type: string
                  data:
                    description: Data
                    type: array
                    items:
                      properties:
                        subdomains:
                          description: 'List of subdomains'
                          type: array
                          items:
                            type: object
                        packages:
                          description: 'List of packages'
                          type: array
                          items:
                            type: object
                        ssl_auto:
                          description: 'SSL auto'
                          type: boolean
                        allow_letsencrypt_wildcard:
                          description: 'Allow letsencrypt wildcard'
                          type: boolean
                        dnssec_warn:
                          description: 'DNSSEC warn'
                          type: boolean
                          example: false
                        cname_required:
                          description: 'CNAME required'
                          type: boolean
                      type: object
                type: object
  '/{domainId}/ssl/{id}':
    get:
      tags:
        - SSL
      summary: 'Get information about SSL certificate'
      operationId: sslShow
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: id
          in: path
          description: 'ID certificate'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    description: 'true if request was successful'
                    type: boolean
                  data:
                    description: Data
                    type: object
                type: object
    delete:
      tags:
        - SSL
      summary: 'Delete SSL certificate'
      operationId: sslDelete
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: id
          in: path
          description: 'ID certificate'
          required: true
          schema:
            type: integer
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
  '/{domainId}/ssl/httpsRedirect':
    post:
      tags:
        - SSL
      summary: 'Enable http to https redirect'
      operationId: sslHttpsRedirect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                https_redirect:
                  description: 'Enable / Disable http to https redirect'
                  type: integer
                  example: 1
                  enum:
                    - 0
                    - 1
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
  '/{domainId}/ssl':
    get:
      tags:
        - SSL
      summary: 'Get all SSL certificates for domain'
      operationId: sslIndex
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    description: 'true if request was successful'
                    type: boolean
                  data:
                    description: Data
                    type: array
                    items:
                      properties:
                        ssls:
                          description: 'SSL certificates'
                          type: array
                          items:
                            properties:
                              IDcert:
                                description: IDcert
                                type: integer
                                example: 1
                              IDdomeny:
                                description: IDdomeny
                                type: integer
                                example: 234
                              domain_name:
                                description: 'Certificate domain name'
                                type: string
                                example: example.com
                              crt:
                                description: 'Certificate public key'
                                type: string
                                example: '-----BEGIN CERTIFICATE-----...'
                              key:
                                description: 'Certificate private key'
                                type: string
                                example: '-----BEGIN PRIVATE KEY-----...'
                              chain:
                                description: 'Certificate chain'
                                type: string
                                example: ''
                              status:
                                description: 'Certificate status'
                                type: string
                                example: ACTIVE
                                enum:
                                  - TO_ACTIVATE
                                  - ACTIVE
                                  - INACTIVE
                                  - ERROR
                                  - TO_DELETE
                                  - TO_CHANGE
                                  - TO_ORDER
                                  - TO_REVOKE
                              date_valid:
                                description: 'Date valid'
                                type: string
                                format: date
                              date_add:
                                description: 'Date add'
                                type: string
                                format: 'Y-m-d H:i:s'
                                example: '2021-01-01 00:00:00'
                              date_change:
                                description: 'Date change'
                                type: string
                                format: 'Y-m-d H:i:s'
                                example: '2024-11-01 05:01:00'
                              type:
                                description: 'Certificate type'
                                type: string
                                enum:
                                  - DOMAIN
                                  - DOMAIN_AND_SUBDOMAIN
                                  - LETSENCRYPT
                                  - LETSENCRYPT_WILDCARD
                              order_type:
                                description: 'Order type'
                                type: string
                                example: null
                                nullable: true
                            type: object
                        ssl_auto:
                          description: 'SSL auto'
                          type: boolean
                        server_webserver_type:
                          description: 'Server webserver type'
                          type: string
                          enum:
                            - apache
                            - nginx
                            - nginxonly
                      type: object
                type: object
    post:
      tags:
        - SSL
      summary: 'Store SSL certificate'
      operationId: sslStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                -
                  description: 'Store SSL certificate'
                  properties:
                    domain_name:
                      description: 'Domain name'
                      type: string
                    type:
                      description: 'Type of SSL certificate'
                      type: string
                      enum:
                        - LETSENCRYPT
                        - LETSENCRYPT_WILDCARD
                        - DOMAIN
                        - DOMAIN_AND_SUBDOMAIN
                  type: object
                -
                  description: 'Enable http to https redirect'
                  properties:
                    https_redirect:
                      description: 'Enable / Disable http to https redirect'
                      type: integer
                      example: 1
                      enum:
                        - 0
                        - 1
                  type: object
                  deprecated: true
            examples:
              '{"domain_name": "example.com", "type": "LETSENCRYPT"}':
                summary: 'Store SSL certificate'
                value: '{"domain_name": "example.com", "type": "LETSENCRYPT"}'
              '{"https_redirect": 1}':
                summary: 'Enable / Disable http to https redirect - deprecated'
                description: 'Use /{domainId}/ssl/httpsRedirect'
                value: '{"https_redirect": 1}'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    description: 'true if request was successful'
                    type: boolean
                  invoice_number:
                    description: 'Invoice number'
                    type: string
                    example: null
                    nullable: true
                type: object
        400:
          $ref: '#/components/responses/Error'
  /recurring-payments/get-active-recurrence:
    get:
      tags:
        - Billing
        - 'Recurrent Payments'
      summary: 'Get active recurrent payment'
      description: 'This endpoint retrieves the active recurrent payment details for a customer, including detailed information about the card used, its classification, 3DS verification status, and transaction results. It also provides the customer ID, transaction currency, and the statuses of both initialization and on-demand transactions. The data can be used to monitor or manage active recurrent payments associated with the given customer. Recurrent payments can only be used if the initialization transaction status is set to "Completed".'
      operationId: 08d85ccc27fd5419bf4f86cef1daa2dc
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    description: 'true if request was successful'
                    type: boolean
                  data:
                    description: Data
                    properties:
                      cardNumber:
                        description: 'Partly masked card number used for transaction.'
                        type: string
                        example: '654321******1234'
                      cardClassification:
                        description: 'Classification of used card. E.g. credit or debit.'
                        type: string
                        example: CREDIT
                      card3DsStatus:
                        description: 'Status of 3DS verification.'
                        type: string
                        example: 'Y'
                      cardScheme:
                        description: 'Card organization.'
                        type: string
                        example: MC
                      cardBinCountry:
                        description: 'Code of country in which card was issued.'
                        type: string
                        example: SK
                      card3DsStatusDescription:
                        description: 'More detail description of 3DS status.'
                        type: string
                        example: '-'
                      cardProfile:
                        description: 'Profile of used card. E.g. consumer or business.'
                        type: string
                        example: CONSUMER
                      cardEciCode:
                        description: 'Electronic Commerce Indicator.'
                        type: string
                        example: '2'
                      card3DsFrictionlessIndicator:
                        description: 'Indicator of frictionless transaction.'
                        type: string
                        example: 'YES'
                      cardResponseCode:
                        description: 'Code of transaction result.'
                        type: string
                        example: '000'
                      cardResponseCodeDesc:
                        description: 'Code description of transaction result.'
                        type: string
                        example: OK
                      responseCodeAdditionalInformation:
                        description: 'Additional information to transaction result.'
                        type: string
                        example: 'Successful authorization.'
                      currency:
                        description: 'Currency of transaction.'
                        type: string
                        example: EUR
                      customerId:
                        description: 'Customer ID.'
                        type: integer
                        example: '123934'
                      status:
                        description: 'Status of initialization transaction.'
                        type: string
                        example: Completed
                        enum:
                          - Created
                          - WaitingForConfirmation
                          - Completed
                          - ManualAttentionRequired
                          - Invalid
                          - Canceled
                          - Timeouted
                          - Error
                      onDemandStatus:
                        description: 'Status of on demand transaction.'
                        type: string
                        example: Completed
                        enum:
                          - Created
                          - WaitingForConfirmation
                          - InProgress
                          - Completed
                          - ManualAttentionRequired
                          - Invalid
                          - Canceled
                          - Timeouted
                          - Error
                    type: object
                  acceptedConditions:
                    description: 'Accepted conditions'
                    type: boolean
                    example: true
                  enabledRecurrentPaymentOnAllServices:
                    description: 'Has enabled recurrent payment on all services'
                    type: boolean
                    example: true
                type: object
        400:
          $ref: '#/components/responses/Error'
  /recurring-payments/de-authorize-recurrent-payment:
    delete:
      tags:
        - Billing
        - 'Recurrent Payments'
      summary: 'Cancel authorize recurrent payment'
      description: 'The endpoint to revoke authorization for recurring payments for a customer.'
      operationId: 2928c1bb8ece43c2c519e31c62441a1b
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
  /recurring-payments/create-recurrence-validation-payment:
    post:
      tags:
        - Billing
        - 'Recurrent Payments'
      summary: 'Create recurrence validation payment'
      description: 'This endpoint creates a recurrence validation payment for a customer. It requires a return URL (`rurl`) to redirect the user after completing the payment process. Upon successful execution, it provides the URL for the payment gateway where the validation process can be completed. The endpoint ensures that the recurrent payment request complies with defined business rules and limits prior to initiating the validation process.'
      operationId: 92124be012b00cd75ee8fbccc4a347e9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                rurl:
                  description: 'return url'
                  type: string
                  example: 'https://example.com/rurl'
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    description: 'true if request was successful'
                    type: boolean
                    example: true
                  url:
                    description: 'url to redirect'
                    type: string
                    example: 'https://api.example.com/payment?id=1234567890'
                type: object
        400:
          $ref: '#/components/responses/Error'
  /recurring-payments/disable-recurrent-payment-for-service:
    post:
      tags:
        - Billing
        - 'Recurrent Payments'
      summary: 'Disable recurrent payment for service'
      description: 'This endpoint disables the recurrent payment for a specific service identified by the provided `serviceId`. It ensures that the recurrent payment for the service is deactivated for the specified customer. Upon success, the endpoint returns a `success: true` response. This functionality is useful when a customer no longer wishes to use recurrent payments for a given service.'
      operationId: b433419cbd567876cb1a7bc6c0953c85
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                serviceId:
                  description: 'service id'
                  type: integer
                  example: '1234567890'
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
  /recurring-payments/enable-recurrent-payment-for-all-active-services:
    post:
      tags:
        - Billing
        - 'Recurrent Payments'
      summary: 'Enable recurrent payment for all active services'
      description: 'This endpoint enables the recurrent payment for all active services of the customer. A service is considered active when `vyuzivanieKon > vyuzivanieZac` and `vyuzivanieKon >= CURDATE()`. Upon success, the endpoint returns the count of updated services.'
      operationId: 860c52b2af6523685f24c283e07efb91
      responses:
        200:
          description: 'Number of services updated'
          content:
            application/json:
              schema:
                properties:
                  updatedCount:
                    description: 'Number of services that had recurrent payment enabled'
                    type: integer
                    example: 3
                type: object
        400:
          $ref: '#/components/responses/Error'
  /recurring-payments/enable-recurrent-payment-for-service:
    post:
      tags:
        - Billing
        - 'Recurrent Payments'
      summary: 'Enable recurrent payment for service'
      description: 'This endpoint enables the recurrent payment for a specific service identified by the provided `serviceId`. It ensures that the recurrent payment for the service is activated for the specified customer. Upon success, the endpoint returns a `success: true` response. This functionality is useful when a customer wishes to use recurrent payments for a given service.'
      operationId: b563b03ca8e8cc2242d3c5a21b6e532a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                serviceId:
                  description: 'service id'
                  type: integer
                  example: '1234567890'
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
  /recurring-payments/list-payments-based-on-recurrence:

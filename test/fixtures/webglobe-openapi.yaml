                  type: string
                  example: WEBG
                lang:
                  type: string
                  example: sk
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteBuilderUpgradeInfoResponse'
        400:
          $ref: '#/components/responses/Error'
      security:
        bearerAuth: []
components:
  schemas:
    RegContactData:
      description: 'Registrant/administrative contact data. The same shape is accepted in `contact_data` request payloads and returned in responses; `contact_id`, `customer_id`, `single_tld`, `status`, `type`, `registered_in`, `redacted` and the deprecated `disclosed` are response-only and ignored on input.'
      properties:
        contact_id:
          description: 'Contact ID (response only)'
          type: integer
          example: 12345
        customer_id:
          description: 'Owning customer ID (response only)'
          type: integer
          example: 6789
        single_tld:
          description: 'TLD this contact is registered for'
          type: string
          example: sk
        status:
          description: 'Contact status (response only)'
          type: string
          nullable: true
          enum:
            - TO_REGISTER
            - REGISTERED
            - TO_UPDATE_IN
            - TO_UPDATE_OUT_AUTHORIZATION
            - TO_TRANSFER
            - DELETED
            - DENIED
            - EMPTY
            - NO_HANDLE
        type:
          description: 'Contact role'
          type: string
          example: REGISTRANT
          enum:
            - REGISTRANT
            - BILL
            - ADMIN
            - TECH
            - LOCAL
        registered_in:
          description: 'Automated register the contact is stored in (response only)'
          type: string
          nullable: true
          enum:
            - sknic
            - eurid
            - joker
            - subreg
            - cznic
            - rrpproxy
        company_id:
          description: 'Company registration number (IČO)'
          type: string
          nullable: true
        tax_id:
          description: 'Tax ID (DIČ)'
          type: string
          nullable: true
        vat_id:
          description: 'VAT ID (IČ DPH)'
          type: string
          nullable: true
        statutory_representative:
          type: string
          nullable: true
        legal_form:
          type: string
          example: OTHER
          enum:
            - FO
            - SRO
            - AS
            - Z
            - OTHER
        org_type:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        street:
          type: string
          example: 'Hlavná 1'
        town:
          type: string
          example: Bratislava
        postcode:
          type: string
          example: '81101'
        country:
          description: 'ISO 3166-1 alpha-2 country code'
          type: string
          example: SK
        province:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        fax:
          type: string
          nullable: true
        contact_name:
          type: string
          nullable: true
        contact_name_title:
          type: string
          nullable: true
        contact_name_first:
          type: string
          nullable: true
        contact_name_last:
          type: string
          nullable: true
        lang:
          description: 'ISO 639-1 language code'
          type: string
          example: sk
        disclose:
          description: 'Fields the registrant consents to publish (sknic/cznic only)'
          type: array
          items:
            type: string
            enum:
              - addr
              - voice
              - fax
              - email
              - notifyEmail
              - vat
              - ident
          nullable: true
        redacted:
          description: 'Fields that were redacted because they were not marked for disclosure (response only)'
          type: array
          items:
            type: string
          nullable: true
        disclosed:
          description: 'Deprecated — use `redacted` instead. Same contents, emitted only for backwards compatibility and scheduled for removal.'
          type: array
          items:
            type: string
          nullable: true
          deprecated: true
        notifyEmail:
          type: string
          format: email
          nullable: true
        identType:
          type: string
          nullable: true
        identValue:
          type: string
          nullable: true
      type: object
    DnsRecord:
      description: 'DNS resource record (RR)'
      properties:
        id:
          type: integer
          example: 1234
        zone:
          description: 'SOA zone ID'
          type: integer
          example: 45
        name:
          description: 'Record name, relative to the domain (empty for the domain root)'
          type: string
          example: www
        ttl:
          type: integer
          example: 3600
        type:
          type: string
          example: A
          enum:
            - A
            - AAAA
            - CNAME
            - MX
            - NS
            - TXT
            - SRV
            - CAA
            - TLSA
        aux:
          description: 'Priority/preference value (used by MX/SRV records)'
          type: integer
          example: 0
        data:
          description: 'Record value. For SRV records this is "priority weight port target"'
          type: string
          example: 192.0.2.1
      type: object
    ErrorBody:
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          description: 'Error object'
          required:
            - message
          properties:
            message:
              description: 'A human-readable message providing more details about the error'
              type: string
              example: 'Unknown error - problem has been reported and will be fixed soon.'
            code:
              description: 'A specific error code indicating the error type'
              type: integer
              example: 1
            data:
              description: 'Additional error data'
              type: object
              nullable: true
          type: object
      type: object
    DatabaseUser:
      description: 'Database user with the privileges held on a given database'
      properties:
        user_id:
          type: integer
          example: 12345
        domain_id:
          type: integer
          example: 234
        user_name:
          type: string
          example: example_com_1
        user_info:
          description: 'User description'
          type: string
          example: ''
        user_perm:
          description: 'all for full privileges, spec for a specific set'
          type: string
          example: all
          enum:
            - all
            - spec
        user_grant:
          description: 'ALL or a comma separated list of privileges on the database'
          type: string
          example: ALL
      type: object
    DatabaseServer:
      description: 'Database server on which a database runs or can be created'
      properties:
        vserver_id:
          type: integer
          example: 7
        server_id:
          type: integer
          example: 3
        vserver_type:
          description: 'Database server type used when creating a database'
          type: string
          example: db_mysql_8
        vserver_inet_name:
          description: 'Hostname for connections from the internet'
          type: string
          example: mysql51.webglobe.com
        vserver_intranet_name:
          description: 'Hostname for connections from the hosting server'
          type: string
          example: localhost
      type: object
    SslStoreOwnCertificateResponse:
      description: 'Response for SSL own certificate store'
      required:
        - success
        - id
      properties:
        id:
          description: 'The ID of the stored SSL own certificate'
          type: integer
          example: 123
        success:
          description: 'Indicates if the request was successful'
          type: boolean
          example: true
      type: object
    SslValidateOwnCertificateResponse:
      description: 'Response for SSL own certificate validation'
      required:
        - success
        - data
      properties:
        success:
          description: 'Indicates if the request was successful'
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SslValidateOwnCertificateResponseData'
      type: object
    SslValidateOwnCertificateResponseData:
      description: 'Response containing validated SSL certificate details'
      required:
        - subject
        - issuer
        - valid_from
        - valid_to
        - domain
        - serial_number
        - purposes
        - extensions
      properties:
        subject:
          description: 'Certificate subject details'
          type: object
        issuer:
          description: 'Certificate issuer details'
          type: object
        valid_from:
          description: 'Certificate valid from date'
          type: string
        valid_to:
          description: 'Certificate valid to date'
          type: string
        domain:
          description: 'Domain name in the certificate'
          type: string
        serial_number:
          description: 'Certificate serial number'
          type: string
        purposes:
          description: 'Certificate purposes'
          type: array
          items:
            type: string
        extensions:
          description: 'Certificate extensions'
          type: object
      type: object
    CommissionCategoryRateResponse:
      required:
        - category
        - rate

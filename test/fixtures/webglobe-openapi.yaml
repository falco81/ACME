  /auth/login:
    post:
      tags:
        - Auth
      summary: 'Auth user and get token and user data'
      description: "Use your administrative login to log in.\n        <ul>\n            <li>\n                In case your account is set up with SMS 2FA, you will need to authorize it twice. <br>\n                The first time to verify your login and password, where after verification the system will send an SMS code to your registered phone number.<br>\n                Then you need to send the login and password along with the SMS code.<br>\n                Error code <strong>1034</strong> is returned when the SMS code is required.\n            </li>\n            <li>\n                In case your account is set up with OTP 2FA, you need to send the OTP code together with your login and password.<br>\n                Error code <strong>24</strong> is returned when the OTP code is required.\n            </li>\n            <li>\n                In case your account is set up with Email 2FA, you will need to authorize it twice.<br>\n                The first time to verify your login and password, where after verification the system will send a code to your email address.<br>\n                Then you need to send the login and password along with the email code.<br>\n                Error code <strong>1382</strong> is returned when the email code is required. The error response includes a <code>data.emails</code> field with a masked email addresses.\n            </li>\n            <li>\n                Instead of a password, you can authenticate using an API token by sending <code>login</code> and <code>token</code> (API token) without a <code>password</code> field.\n            </li>\n            <li>\n                If <code>remember_me</code> is set to <code>true</code>, the response will include a <code>data.remember_me_cookie_value</code> token.<br>\n                Store this token and use it with the <code>POST /auth/remember-me</code> endpoint to authenticate without login and password.\n            </li>\n        </ul>"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - login
              properties:
                login:
                  type: string
                  example: user@example.com
                password:
                  type: string
                token:
                  description: 'API token — alternative to password'
                  type: string
                  example: api-token-value
                billfirm:
                  description: 'Limiting login to a specific billfirm'
                  type: string
                  example: IGN
                sms:
                  description: 'SMS key if user use SMS 2FA '
                  type: string
                  example: '123456'
                otp:
                  description: 'One-time password if user use OTP 2FA'
                  type: string
                  example: '123456'
                remember_me:
                  description: 'Remember user'
                  type: boolean
                  example: true
                email_code:
                  description: 'Email code if user use Email 2FA'
                  type: string
                  example: '12345'
              type: object
            examples:
              '{"login":"test@example.com","password":"Secret@Password"}':
                summary: 'Login with login and password'
                value: '{"login":"test@example.com","password":"Secret@Password"}'
              '{"login":"test@example.com","password":"Secret@Password", "sms": "123456"}':
                summary: 'Login with login, password and SMS 2FA'
                value: '{"login":"test@example.com","password":"Secret@Password", "sms": "123456"}'
              '{"login":"test@example.com","password":"Secret@Password", "otp": "123456"}':
                summary: 'Login with loginm, password and OTP 2FA'
                value: '{"login":"test@example.com","password":"Secret@Password", "otp": "123456"}'
              '{"login":"test@example.com","password":"Secret@Password", "email_code": "12345"}':
                summary: 'Login with login, password and Email 2FA'
                value: '{"login":"test@example.com","password":"Secret@Password", "email_code": "12345"}'
              '{"login":"test@example.com","password":"Secret@Password", "remember_me": true}':
                summary: 'Login with remember-me (response will include remember_me_cookie_value)'
                value: '{"login":"test@example.com","password":"Secret@Password", "remember_me": true}'
              '{"login":"test@example.com","token":"api-token-value"}':
                summary: 'Login with login and API token (instead of password)'
                value: '{"login":"test@example.com","token":"api-token-value"}'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                properties:
                  success:
                    description: 'true if request was successful'
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LoginResponseData'
                type: object
        400:
          description: 'Bad request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                sms_required:
                  summary: 'SMS code required (error 1034)'
                  value:
                    success: false
                    error:
                      message: 'SMS key is required.'
                      code: 1034
                otp_required:
                  summary: 'OTP code required (error 24)'
                  value:
                    success: false
                    error:
                      message: 'One-time password is required.'
                      code: 24
                email_required:
                  summary: 'Email code required (error 1382)'
                  value:
                    success: false
                    error:
                      message: 'Email code is required.'
                      code: 1382
                      data:
                        emails:
                          - 't***@example.com'
      security: []
  /auth/remember-me:
    post:
      tags:
        - Auth
      summary: 'Auth user via remember-me cookie and get token and user data'
      description: 'Authenticate using a remember-me cookie value obtained from a previous login response. Returns the same data as the standard login endpoint.'
      operationId: loginByRememberMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - remember_me
              properties:
                remember_me:

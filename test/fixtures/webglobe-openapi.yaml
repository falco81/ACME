              - pinned
              - multi
              - reg
              - dns
              - host
              - mail
              - vps
              - cloud
              - server
              - ssl
              - wsb
        -
          name: full
          in: query
          description: 'When present, also include domains of all child sub-accounts'
          schema:
            type: string
        -
          name: without_till
          in: query
          description: 'When set to a non-zero value, skips the service-visibility ("has_access") check used for date search and extra fields'
          schema:
            type: integer
            default: 0
        -
          name: search
          in: query
          description: 'Search by domain name (LIKE match), or by expiration date/date range (accepts "d.m.Y", "d.m.Y-d.m.Y", "Y-m-d" or "Y-m-d-Y-m-d" formats) when the account has service-visibility access'
          schema:
            type: string
        -
          name: search_by
          in: query
          description: 'Alternative search column, only "IDregistrant" is supported'
          schema:
            type: string
            enum:
              - IDregistrant
        -
          name: search_value
          in: query
          description: 'Value used together with search_by'
          schema:
            type: string
        -
          name: per_page
          in: query
          description: 'Items per page for each category (becomes unlimited when the account has 10 or fewer domains)'
          schema:
            type: integer
            default: 10
        -
          name: sort_dir
          in: query
          description: 'Sort direction'
          schema:
            type: string
            default: ASC
            enum:
              - ASC
              - DESC
        -
          name: sort_key
          in: query
          description: 'Sort column'
          schema:
            type: string
            default: domain
            enum:
              - domain
              - dt_till
      responses:
        200:
          description: 'Domains grouped by category'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK

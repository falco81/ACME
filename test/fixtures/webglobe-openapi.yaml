                            type: string
                            example: '1234567890'
                            nullable: true
                          bank__bic:
                            type: string
                            example: TATRSKBX
                            nullable: true
                          bank__iban:
                            type: string
                            example: SK1234567890123456789012
                            nullable: true
                          bank__name:
                            type: string
                            example: 'Tatra banka'
                            nullable: true
                        type: object
                        nullable: true
                      paylinks:
                        type: array
                        items:
                          type: string
                      paylink_bysquare:
                        description: 'QR payment code (present only when "rurl" is set for a payable invoice)'
                        type: string
                        nullable: true
                      typyibank:
                        description: 'Available payment banking types'
                        type: array
                        items:
                          type: string
                        nullable: true
                      recurrent_payment_scheduled_at:
                        description: 'When the queued recurrent card payment (Besteron On Demand) will be charged, null when none is queued or the invoice is not payable by recurrence'
                        type: string
                        example: '2026-10-09 00:00:00'
                        nullable: true

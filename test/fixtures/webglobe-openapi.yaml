      description: 'Creates a registrant change request for a .sk domain with the WEBG-0001 registrant handle. Sends confirmation e-mails to the old and new registrant addresses; the change only takes effect once both approve it. When the new registrant is outside the EU/EEA/EFTA, a Local Contact is also required.'
      operationId: domains.update
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - regPravnaForma
                - regFirma
                - regUlica
                - regMesto
                - regPSC
                - regStat
                - regKontakt
                - regTel
                - regMail
              properties:
                regPravnaForma:
                  description: 'Legal form'
                  type: string
                  enum:
                    - Z
                    - SRO
                    - AS
                    - FO
                    - OTHER
                regICO:
                  description: 'Company ID, or date of birth ("d.m.Y" or "Y-m-d") when regPravnaForma is "FO"'
                  type: string
                  nullable: true
                regDIC:
                  type: string
                  nullable: true
                regICDPH:
                  type: string
                  nullable: true
                regFirma:
                  description: 'Organization / name'
                  type: string
                regUlica:
                  description: Address
                  type: string
                regMesto:
                  description: City
                  type: string
                regPSC:
                  description: 'Postal code'
                  type: string
                regStat:
                  description: 'Country code'
                  type: string
                regProvincia:
                  type: string
                  nullable: true
                regKontakt:
                  description: 'Contact name'
                  type: string
                regTel:
                  description: 'Contact phone'
                  type: string
                regMail:
                  description: 'Contact e-mail(s), separated by "," or ";"'
                  type: string
                local_regPravnaForma:
                  description: 'Required (with the other local_* fields) when regStat is outside the EU/EEA/EFTA for a .sk domain'
                  type: string
                  enum:
                    - Z
                    - SRO
                    - AS
                    - FO
                    - OTHER
                local_regICO:
                  type: string
                  nullable: true
                local_regDIC:
                  type: string
                  nullable: true
                local_regICDPH:
                  type: string
                  nullable: true
                local_regFirma:
                  type: string
                local_regUlica:
                  type: string
                local_regMesto:
                  type: string
                local_regPSC:
                  type: string
                local_regStat:
                  description: 'Must be an EU/EEA/EFTA country code'
                  type: string
                local_regProvincia:
                  type: string
                  nullable: true
                local_regKontakt:
                  type: string
                local_regTel:
                  type: string
                local_regMail:
                  type: string
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/domains/{domainId}/pin':
    post:
      tags:
        - Domains
      summary: 'Toggle pinned domain'

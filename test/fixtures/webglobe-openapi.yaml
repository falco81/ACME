                        example: '2026001234'
                      invoice_type:
                        type: string
                        example: F
                      invoice_status:
                        type: string
                        example: PAID
                      currency:
                        type: string
                        example: EUR
                      price_base:
                        type: number
                        format: float
                        example: 41.32
                      price_vat:
                        type: number
                        format: float
                        example: 49.58
                      price_paid:
                        type: number
                        format: float
                        example: 49.58

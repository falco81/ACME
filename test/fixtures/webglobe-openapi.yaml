  /invoices:
    get:
      tags:
        - Invoices
      summary: 'List invoices'
      description: 'Returns a paginated list of the customer''s invoices. Excludes trashed/checked invoices, invoice type "S" and recurrent proforma invoices.'
      operationId: invoices.index
      parameters:
        -
          name: per_page
          in: query
          description: 'Items per page'
          schema:
            type: integer
            default: 20
        -
          name: order
          in: query
          description: 'Sort as "<column> <ASC|DESC>", column one of IDinvoice, dt_create, dt_maturity'
          schema:
            type: string
            example: 'dt_maturity DESC'
        -
          name: invoice_type
          in: query
          description: 'Filter by invoice type'
          schema:
            type: string
            enum:
              - D
              - F
              - PF
        -
          name: invoice_status
          in: query
          description: 'Filter by status. "paid"/"unpaid"/"afterpaymentdue" are convenience groups, otherwise pass one or more raw status values.'
          schema:
            oneOf:
              -
                type: string
                enum:
                  - paid
                  - unpaid
                  - afterpaymentdue
              -
                type: array
                items:
                  type: string
        -
          name: invoice_number
          in: query
          description: 'Filter by invoice number (LIKE match)'
          schema:
            type: string
        -
          name: date_from
          in: query
          description: 'Filter dt_create from (YYYY-MM-DD)'
          schema:
            type: string
            format: date
        -
          name: date_to
          in: query
          description: 'Filter dt_create to (YYYY-MM-DD)'
          schema:
            type: string
            format: date
        -
          name: ids
          in: query
          description: 'Filter by invoice IDs'
          schema:
            type: array
            items:
              type: integer
        -
          name: domain_id
          in: query
          description: 'Filter invoices containing an item for this domain (IDdomeny)'
          schema:
            type: integer
        -
          name: invoice_domain_name
          in: query
          description: 'Filter invoices containing an item for domains matching this name (LIKE match)'
          schema:
            type: string
        -
          name: dt_tax
          in: query
          description: 'When present, include dt_tax column in the result'
          schema:
            type: string
        -
          name: without_pfp
          in: query
          description: 'When present, skip parent/proforma cross-reference and items enrichment'
          schema:
            type: string
        -
          name: without_items
          in: query
          description: 'When present, skip loading invoice items'
          schema:
            type: string
      responses:
        200:
          description: 'Paginated invoice list'
          content:
            application/json:
              schema:
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      properties:
                        IDinvoice:
                          type: integer
                          example: 12345
                        IDparent:
                          type: integer
                          example: 12000
                          nullable: true
                        invoice_status:
                          type: string
                          example: PAID
                        invoice_number:
                          type: string
                          example: '2026001234'
                        vs:
                          type: string
                          example: '2026001234'
                        ks:
                          type: string
                          example: '0308'
                        invoice_type:
                          type: string
                          example: F
                        price_base:
                          type: number
                          format: float
                          example: 41.32
                        price_vat:
                          type: number
                          format: float
                          example: 49.58
                        price_paid:
                          type: number
                          format: float
                          example: 49.58
                        currency:
                          type: string
                          example: EUR
                        dt_create:
                          type: string
                          format: date
                          example: '2026-01-05'
                        dt_maturity:
                          type: string
                          format: date
                          example: '2026-01-19'
                        lang:
                          type: string
                          example: sk
                        invoice_flags:
                          type: string
                          example: recurrent
                          nullable: true
                        invoice_template:
                          type: string
                          example: default
                        customer_name:
                          type: string
                          example: 'John Doe'
                        customer_ico:
                          type: string
                          example: '12345678'
                          nullable: true
                        billfirm:
                          type: string
                          example: WEBG
                        pfx:
                          description: 'For proforma invoices: ID of the related tax invoice'
                          type: integer
                          nullable: true
                        pfx_invoice_number:
                          type: string
                          nullable: true
                        parent_invoice_number:
                          type: string
                          nullable: true
                        items:
                          type: array
                          items:
                            properties:
                              IDitem:
                                type: integer
                                example: 1
                              IDinvoice:
                                type: integer
                                example: 12345
                              IDservice:
                                type: integer
                                example: 5555
                                nullable: true
                              item_text:
                                type: string
                                example: 'Web hosting'
                              item_subtext:
                                type: string
                                nullable: true
                              unit_name:
                                type: string
                                example: ks
                              unit_quantity:
                                type: number
                                format: float
                                example: 1
                              unit_price:
                                type: number
                                format: float
                                example: 41.32
                              unit_vatrate:
                                type: number
                                format: float
                                example: 20
                              dt_from:
                                type: string
                                format: date
                                nullable: true
                              dt_till:
                                type: string
                                format: date
                                nullable: true
                            type: object
                      type: object
                  last_page:
                    type: integer
                    example: 3
                  per_page:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 42
                  credit_status:
                    properties:
                      has_acc:
                        type: boolean
                        example: true
                      balance_locked:
                        type: number
                        format: float
                        example: 0
                    type: object
                  status:
                    type: string
                    example: OK
                  success:
                    type: boolean
                    example: true
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/invoices/{invoice}':

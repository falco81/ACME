        -
          bearerAuth: []
  '/domain/{domainId}/cancel-owner-authorisation':
    post:
      tags:
        - Domains
      summary: 'Cancel pending change-owner authorisation'
      description: 'Cancels any pending DOMAIN_TRADE_AUTHORIZATION (change owner) todos for the domain.'
      operationId: domains.cancelChangeOwnerAuthorisation
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/domain/{domainId}/change-contacts':
    post:
      tags:
        - Domains
      summary: 'Request domain contacts change'
      description: "Requests a change of the domain's admin/tech registry contacts. Validates each contact handle against the registry, then creates a DOMAIN_AUTHORIZATION todo (with a chained DOMAIN_CONTACT_UPDATE todo) requiring registrant/admin approval. The number of admin contacts allowed depends on the TLD (10 for .cz, 5 for .eu, 1 otherwise)."
      operationId: domains.setContacts
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                admins:
                  description: 'Admin contact handles'
                  type: array
                  items:
                    type: string
                techs:
                  description: 'Tech contact handles'
                  type: array
                  items:
                    type: string
                reset:
                  description: 'When 1, cancels an existing pending request instead of failing'
                  type: integer
                  enum:
                    - 0
                    - 1
                approver:
                  description: 'Contact handle(s) allowed to approve the authorisation'
                  type: string
              type: object
      responses:
        200:
          description: 'Contact change request created'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  idtodo:
                    description: 'ID of the created DOMAIN_CONTACT_UPDATE todo'
                    type: integer
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/domain/{domainId}/change-owner':
    post:
      tags:
        - Domains
      summary: 'Request domain owner change'
      description: 'Requests a change of domain owner (registrant). With type="notary" (default "email"), generates and stores a notarised authorization PDF and e-mails it to the given address. Otherwise creates a DOMAIN_TRADE_AUTHORIZATION todo requiring approval. Also reachable at POST /{domainId}/change-owner.'
      operationId: domains.setNewOwner
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - new_owner
              properties:
                new_owner:
                  description: 'New registrant handle'
                  type: string
                type:
                  description: 'Authorisation flow, default "email"'
                  type: string
                  enum:
                    - email
                    - notary
                lang:
                  description: "Template language for the notary PDF, defaults to the customer's billing language"
                  type: string
                email:
                  description: 'Recipient of the notary authorisation e-mail, only used when type="notary"'
                  type: string
                  format: email
                reset:
                  description: 'When 1, cancels an existing pending owner-change request instead of failing'
                  type: integer
                  enum:
                    - 0
                    - 1
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/{domainId}/change-owner':
    post:
      tags:
        - Domains
      summary: 'Request domain owner change (alias)'
      description: 'Alias of POST /domain/{domainId}/change-owner, same behaviour.'
      operationId: domains.setNewOwnerAlias

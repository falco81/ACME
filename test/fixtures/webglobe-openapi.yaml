        customer_email:
          description: 'Customer email'
          type: string
          example: test@webglobe.com
        reseller_settings:
          description: 'Customer reseller settings'
          type: object
        currency:
          description: 'Customer currency'
          type: string
          example: EUR
        credit_account:
          description: 'Customer credit account'
          type: boolean
          example: false
        credit_account_info:
          description: 'Customer credit account info'
          type: object
          example: null

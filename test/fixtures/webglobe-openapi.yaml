                        type: object
                      dns_domains:
                        description: 'Paginated list of DNS-park domains'
                        type: object
                      host_domains:
                        description: 'Paginated list of hosted domains'
                        type: object
                      mail_domains:
                        description: 'Paginated list of mail-only domains'
                        type: object
                      vps_domains:
                        description: 'Paginated list of VPS/virtual domains'
                        type: object
                      cloud_domains:

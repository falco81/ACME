          description: 'Empty response, no action is performed'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Services
      summary: 'Update a service (automated billing, credit, auto payment, or billing period)'
      description: 'Modifies a single aspect of a service, selected by which parameter is present in the request body (checked in this order): "automated_billing" toggles automated billing (and disables use-credit / recurrent payment when turned on); "credit" toggles paying the service from account credit (requires an active credit account); "auto_payment" switches the payment method to "credit" (requires an active on-demand recurrent Besteron payment when set to "recurrent", or disables use-credit / recurrent-payment for any other value); "period" changes the billing frequency (in months) - forbidden for reverse-billed, server-category or PHP-extended-support services without a domain, and if the service was already partially invoiced, a new follow-up service is created and open unpaid invoices are updated instead of changing the current service in place. Only one of the four operations is applied per request, in the given order of precedence.'
      operationId: service.update
      parameters:
        -
          name: service
          in: path
          description: 'Service order ID (IDobjednanejSl)'
          required: true
          schema:
            type: integer
            example: 123456
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                -
                  description: 'Toggle automated billing for the service'
                  properties:
                    automated_billing:
                      description: 'Any non-empty value enables automated billing'
                      type: integer
                      example: 1
                      enum:
                        - 0
                        - 1
                  type: object
                -
                  description: 'Toggle paying the service from account credit'
                  properties:
                    credit:
                      description: 'Truthy to pay from credit, falsy to disable'
                      type: boolean
                      example: true
                  type: object
                -
                  description: 'Set the automated payment method'
                  properties:
                    auto_payment:
                      description: 'Any other value disables both credit payment and recurrent payment'
                      type: string
                      example: credit
                      enum:
                        - credit
                        - recurrent
                  type: object
                -
                  description: 'Change the service billing period'
                  properties:
                    period:
                      description: 'New billing period in months, must differ from the current one'
                      type: integer
                      example: 12
                  type: object
            examples:
              automated_billing:
                summary: 'Toggle automated billing'
                value: '{"automated_billing": 1}'
              credit:
                summary: 'Toggle pay from credit'
                value: '{"credit": true}'
              auto_payment_credit:
                summary: 'Set auto payment to credit'
                value: '{"auto_payment": "credit"}'
              auto_payment_recurrent:
                summary: 'Set auto payment to recurrent (Besteron on-demand)'
                value: '{"auto_payment": "recurrent"}'
              auto_payment_other:
                summary: 'Set auto payment to a regular (non-automated) payment'
                value: '{"auto_payment": "none"}'
              period:
                summary: 'Change the billing period'
                value: '{"period": 12}'
      responses:
        200:
          description: 'Result depends on which operation was requested'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                    nullable: true
                  automated_billing:
                    description: 'Present when "automated_billing" was set'
                    type: integer
                    nullable: true
                    enum:
                      - 0
                      - 1
                  service_flags:
                    description: 'Present when "automated_billing" was set'
                    type: string
                    nullable: true
                  use_credit_new:
                    description: 'Present when "credit" was set: 1 if the service is now paid from credit, 0 otherwise'
                    type: integer
                    nullable: true
                    enum:
                      - 0
                      - 1
                  changedInvoices:
                    description: 'Present when "period" was set: numbers of proforma invoices updated because of the period change'
                    type: array
                    items:
                      type: string
                    nullable: true
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Services
      summary: 'Cancel a service'
      description: 'Requests cancellation of a service. Fails if a cancel or process request is already pending for the service, if the service or its domain does not belong to the customer, if "date_of_cancelation" is set but not a valid date, or if the service can''t be cancelled (no domain, or a PHP-extended-support package). On success, creates a SERVICE_CANCEL_REQUEST todo (optionally with the given cancellation date), resolves service withdrawal ("odstúpenie") notifications where applicable, and (unless the reason is "KONIEC_PROJEKTU"/"CANCELED_PROJECT") sends an internal notification email.'
      operationId: service.destroy
      parameters:
        -
          name: service
          in: path
          description: 'Service order ID (IDobjednanejSl)'
          required: true
          schema:
            type: integer
            example: 123456
        -
          name: dovod
          in: query
          description: 'Cancellation reason code. When "INE", the free-text "inydovod" is appended.'
          schema:
            type: string
            example: INE
        -
          name: inydovod
          in: query
          description: 'Free-text reason, used only when dovod="INE"'
          schema:
            type: string
            nullable: true
        -
          name: date_of_cancelation
          in: query
          description: 'Requested cancellation date'
          schema:
            type: string
            format: date
            nullable: true
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []

          type: string
          example: premium
        paid_support_serviceId:
          description: 'Customer paid support service ID'
          type: integer
          example: 123456
          nullable: true
        paid_support_service_package:
          description: 'Customer paid support service package'
          type: string
          example: WEBG_Premium_paid_support
          nullable: true
        remember_me_cookie_value:
          description: 'Remember-me cookie token. Present only when `remember_me` was sent as `true` and the record was created successfully.'
          type: string
          example: a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890
          nullable: true
      type: object
    CustomerDomainPhpVersionPaginatedResponse:

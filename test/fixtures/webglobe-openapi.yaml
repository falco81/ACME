      summary: 'List customer recurrences'
      description: "This endpoint retrieves a list of all recurrent payment transactions associated with a specific customer. Each recurrence includes details such as the transaction status, ID, and timestamps (`created_at` and `updated_at`). This information helps track the customer's active and completed recurrences. Upon success, an array of recurrence data is returned, allowing for efficient management of recurrent payments."

  /services/service:
    get:
      tags:
        - Services
      summary: 'List customer services'
      description: 'Returns a paginated list of the customer''s currently active services (excludes registration/reseller/credit/virtual-server packages and multihosting child packages, and services whose usage period has already ended). For each service, adds per-period prices, the localized package description, cancel/period-change eligibility flags, withdrawal eligibility (Czech Webglobe and Endora billfirms only), and pending cancel/process request IDs for the customer. Also reports whether the customer has an active credit ("K...kredit") domain and an active credit account.'
      operationId: service.index
      parameters:
        -
          name: per_page
          in: query
          description: 'Items per page'
          schema:
            type: integer
            default: 20
        -
          name: service_period
          in: query
          description: 'Filter by billing period in months (frekvenciaCislom)'
          schema:
            type: integer
            example: 12
        -
          name: automated_billing
          in: query
          description: 'Filter by automated billing flag'
          schema:
            type: integer
            enum:
              - 0
              - 1
        -
          name: fakt_use_kredit
          in: query
          description: '"1" to only include services flagged to be paid from credit, any other value to exclude them'
          schema:
            type: string
            example: '1'
        -
          name: domain
          in: query
          description: 'Filter by domain name (LIKE match, IDN converted)'
          schema:
            type: string
            example: example.sk
        -
          name: package
          in: query
          description: 'Filter by exact package code'
          schema:
            type: string
            example: Moj_hosting
      responses:
        200:
          description: 'Paginated service list, keyed by order ID'
          content:
            application/json:
              schema:
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    description: 'Services, keyed by order_id (IDobjednanejSl)'
                    type: object
                    additionalProperties:
                      properties:
                        package:
                          type: string
                          example: Moj_hosting
                        service_type:
                          type: string
                          nullable: true
                        category_name:
                          type: string
                          example: Hosting
                        order_id:
                          type: integer
                          example: 123456
                        customer_id:
                          type: integer
                          example: 12345
                        domain_id:
                          type: integer
                          nullable: true
                        service_count:
                          type: integer
                          example: 1
                        service_start:
                          type: string
                          format: date
                          example: '2026-01-05'
                        service_end:
                          type: string
                          format: date
                          example: '2027-01-05'
                        billed_to:
                          type: string
                          format: date
                          nullable: true
                        service_period:
                          description: 'Billing period in months (frekvenciaCislom)'
                          type: integer
                          example: 12
                        service_discount:
                          type: number
                          format: float
                          nullable: true
                        service_note:
                          type: string
                          nullable: true
                        service_flags:
                          type: string
                          nullable: true
                        automated_billing:
                          type: integer
                          enum:
                            - 0
                            - 1
                        service_unit_price:
                          type: number
                          format: float
                          nullable: true
                        recurrent_payment:
                          type: integer
                          enum:
                            - 0
                            - 1
                        domain:
                          type: string
                          example: example.sk
                          nullable: true
                        alt_name:
                          type: string
                          nullable: true
                        faktCurrency:
                          type: string
                          example: EUR
                        external_service_type:
                          type: string
                          nullable: true
                        periods:
                          description: 'Billing periods (months) available for the package'
                          type: array
                          items:
                            type: integer
                          example:
                            - 1
                            - 12
                        disabledF:
                          description: 'Whether the billing period can be changed'
                          type: boolean
                        disableCancel:
                          description: 'Whether the service can be cancelled'
                          type: boolean
                        withdrawal:
                          description: 'Withdrawal (odstúpenie) eligibility info, only resolved for Czech Webglobe / Endora billfirms'
                        prices:
                          description: 'Price for each available period, keyed by period'
                          type: object
                          nullable: true
                        service_description:
                          description: 'Localized package description'
                          type: string
                      type: object
                  last_page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 3
                  request_cancel:
                    description: 'Order IDs with a pending SERVICE_CANCEL_REQUEST'
                    type: array
                    items:
                      type: integer
                  request_process:
                    description: 'Order/service IDs with a pending todo in progress'
                    type: array
                    items:
                      type: integer
                  status:
                    type: string
                    example: OK
                  success:

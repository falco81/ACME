    CustomersLoginsAuthenticatedResponseData:
      description: 'Paginated response data for authenticated customer logins'
      required:
        - current_page
        - data
        - first_page_url
        - from
        - last_page
        - last_page_url
        - links
        - next_page_url
        - path
        - per_page
        - prev_page_url
        - to
        - total
      properties:
        data:
          description: 'List of authenticated customer logins'
          type: array
          items:
            $ref: '#/components/schemas/CustomersLoginsAuthenticatedResponseDataRow'
        current_page:
          description: 'Current page number'
          type: integer
          example: 1
        from:
          description: 'Index of the first item on the current page'
          type: integer
          example: 1
        last_page:
          description: 'Total number of pages'
          type: integer
          example: 5
        per_page:
          description: 'Number of items per page'
          type: integer
          example: 20
        to:
          description: 'Index of the last item on the current page'
          type: integer
          example: 20
        total:
          description: 'Total number of items'
          type: integer
          example: 100
      type: object
    CustomersLoginsAuthenticatedResponseDataRow:
      description: 'Response data for authenticated customer logins'
      required:
        - id
        - IDzakaznika
        - IDcustlogin
        - login
        - ip
        - ipInRequest
        - userAgent
        - source
        - authenticatedAt
      properties:
        id:
          description: 'Unique identifier of the authenticated login record'
          type: integer
          example: 12345
        IDzakaznika:
          description: 'Customer ID'
          type: integer
          example: 67890
        IDcustlogin:
          description: 'Customer login ID'
          type: integer
          example: 54321
        type:
          description: 'Account type (main, sub, external)'
          type: string
          example: main
          nullable: true
          enum:
            - main
            - sub
            - external
        login:
          description: 'Login name'
          type: string
          example: johndoe
        ip:
          description: 'IP address from which the login was made'
          type: string
          example: 1.1.1.1
        ipInRequest:
          description: 'IP address in the request'
          type: string
          example: 1.1.1.1
        userAgent:
          description: 'User agent string of the client'
          type: string
          example: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.3'
        source:
          description: 'Source of the login'
          type: string
          example: web
        authenticatedAt:
          description: 'Timestamp when the authentication occurred'
          type: string
          example: '2024-01-01 12:00:00'
        success:
          description: 'Indicates if the authentication was successful'
          type: boolean
          example: true
        reason:
          description: 'Reason for authentication failure, if applicable'
          type: string
          example: 'Invalid password'
      type: object

  /my-account/otp/generate:
    post:
      tags:
        - 'My Account'
      summary: 'Generate OTP secret key'
      description: 'Generates a TOTP secret key, stores it in session and returns an otpauth:// URI for QR code rendering. The key must be verified via /my-account/otp/verify before it can be activated.'
      operationId: otpGenerate
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - success
                  - uri
                properties:
                  success:
                    type: boolean
                    example: true
                  uri:
                    type: string
                    example: 'otpauth://totp/WebAdmin:user%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=WebAdmin&digits=6&period=30'
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  /my-account/otp/verify:
    post:
      tags:
        - 'My Account'
      summary: 'Verify OTP code before activation'
      description: 'Verifies a TOTP code against the secret key stored in session by /my-account/otp/generate. On success marks the key as verified in session, which is required before OTP activation via POST /my-account.'
      operationId: otpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - otp
              properties:
                otp:
                  description: 'Current TOTP code from authenticator app'
                  type: string
                  example: '123456'
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    example: true
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  /my-account:
    get:
      tags:
        - 'My Account'
      summary: 'Get account settings'
      description: 'Returns current login settings including allowed IPs, GeoIP restrictions, 2FA status and MojeID pairing.'
      operationId: myAccount.index
      responses:
        200:
          description: 'Account settings'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  data:
                    properties:
                      IDcustlogin:
                        type: integer
                        example: 1234
                      IDparent:
                        type: integer
                        example: 1000
                        nullable: true
                      custlogin_name:
                        description: 'Login name (billing firm suffix removed)'
                        type: string
                        example: user@example.com
                      custlogin_active:
                        type: integer
                        example: 1
                        enum:
                          - 0
                          - 1
                      custlogin_perm_create:
                        type: integer
                        example: 0
                        enum:
                          - 0
                          - 1
                      custlogin_perm_modules:
                        description: 'Permitted modules (ALL or comma-separated)'
                        type: string
                        example: ALL
                      copy:
                        type: integer
                        example: null
                        nullable: true
                      webpartner:
                        type: integer
                        example: null
                        nullable: true
                      email:
                        type: string
                        format: email
                        example: notify@example.com
                        nullable: true
                      yegon:
                        type: integer
                        example: null
                        nullable: true
                      sms_auth:
                        description: 'SMS 2FA active'
                        type: integer
                        example: 0
                        enum:
                          - 0
                          - 1
                      sms_number:
                        type: string
                        example: '+421900123456'
                        nullable: true
                      mojeid:
                        description: 'Paired MojeID - original login form if known, otherwise the opaque OIDC identifier'
                        type: string
                        example: null
                        nullable: true
                      otp:
                        description: 'TOTP secret key (present = TOTP 2FA active)'
                        type: string
                        example: JBSWY3DPEHPK3PXP
                        nullable: true
                      otp_uri:
                        description: 'otpauth:// URI for QR code (null when TOTP inactive)'
                        type: string
                        example: 'otpauth://totp/WebAdmin:user%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=WebAdmin&period=30'
                        nullable: true
                      ips:
                        description: 'Allowed IP ranges'
                        type: array
                        items:
                          properties:
                            id:
                              type: integer
                              example: 7
                            IDcustlogin:
                              type: integer
                              example: 1234
                            ip_start:
                              type: string
                              example: 192.168.1.1
                            ip_end:
                              type: string
                              example: 192.168.1.255
                            ip_type:
                              type: string
                              example: v4
                              enum:
                                - v4
                                - v6
                          type: object
                      geoip:
                        description: 'Allowed countries for this login'
                        type: array
                        items:
                          properties:
                            id:
                              type: integer
                              example: 3
                            cc:
                              description: 'ISO 3166-1 alpha-2 country code'
                              type: string
                              example: SK
                          type: object
                      geoip_all:
                        description: 'All available country codes (cached)'
                        type: array
                        items:
                          properties:
                            cc:
                              type: string
                              example: SK
                            cn:
                              description: 'Country name'
                              type: string
                              example: Slovakia
                          type: object
                      lost_password_emails:
                        description: 'Email addresses for password recovery. Present only for top-level accounts and reseller customer accounts.'
                        type: array
                        items:
                          type: string
                          format: email
                          example: user@example.com
                        nullable: true
                    type: object
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'My Account'
      summary: 'Update account settings'
      description: 'All fields optional. Each triggers a specific action: `password`+`old_password` = change password; `newlogin` = change login name; `email` = change notification email (sub-logins only); `mojeid` (any value) = unpair MojeID; `submit_deactivate_2nd` = deactivate 2FA (requires `otp` or `sms_code`); `otp` = activate TOTP 2FA; `ip_start`+`ip_end` = add allowed IP range; `geoip` = add allowed country.'
      operationId: myAccount.store
      requestBody:
        content:
          application/json:
            schema:
              properties:
                old_password:
                  description: 'Current password (required when changing password)'
                  type: string
                  example: OldPass123!
                password:
                  description: 'New password'
                  type: string
                  example: NewPass456!
                newLogin:
                  description: 'New login name — must be email with an owned domain after @'
                  type: string
                  format: email
                  example: user@myowneddomain.com
                email:
                  description: 'Notification email (null to remove)'
                  type: string
                  format: email
                  example: notify@example.com
                  nullable: true
                mojeid:
                  description: 'Any value — unpairs MojeID'
                  type: string
                  example: '1'
                submit_deactivate_2nd:
                  description: 'Any value — deactivates active 2FA method'
                  type: string
                  example: '1'
                otp:
                  description: 'TOTP secret to activate, or TOTP code to confirm deactivation'
                  type: string
                  example: JBSWY3DPEHPK3PXP
                sms_code:
                  description: 'SMS verification code (required when deactivating SMS 2FA)'
                  type: string
                  example: '123456'
                ip_start:
                  description: 'IP address or range start to allow'
                  type: string
                  example: 192.168.1.1
                ip_end:
                  description: 'Range end (defaults to ip_start)'
                  type: string
                  example: 192.168.1.255
                geoip:
                  description: 'ISO 3166-1 alpha-2 country code to allow, or EUX for all EU countries'
                  type: string
                  example: SK
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []

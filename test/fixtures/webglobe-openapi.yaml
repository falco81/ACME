      description: 'This endpoint lists all payments associated with a specific recurrence for a customer. It provides paginated data containing information about each payment, including its ID, customer ID, transaction details (e.g., transaction ID, on-demand transaction ID), invoice ID, status, and timestamps (`created_at` and `updated_at`). Users can control the pagination using the `perPage` and `page` parameters, with a maximum of 200 items per page.'

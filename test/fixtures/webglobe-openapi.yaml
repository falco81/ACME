          type: string
          example: wcz-webpanel
        mojeid:
          description: 'Customer MojeID - original login form if known, otherwise the opaque OIDC identifier'
          type: string
        token:
          description: 'JWT token'
          type: string
        token_type:
          description: 'JWT token type'
          type: string
        expires_in:

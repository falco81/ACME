  /wsb-upgrade:
    post:
      tags:
        - 'WebsiteBuilder Upgrade'
      summary: 'Upgrade WSB profle'
      description: "Endpoint to update your WSB profile.<br><br>\n<b>Required Fields:</b>\n<ul>\n    <li><b>profileId:</b> Identifier of the WSB profile</li>\n    <li><b>billfirm:</b> Company identifier under which the WSB profile should be searched for</li>\n    <li><b>newPackage:</b> New upgrade package name</li>\n</ul>\n<br>\n<b>Note:</b> The system verifies if the provided profileId exists under the specified billfirm."
      operationId: upgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - profileId
                - billfirm
                - newPackage
              properties:
                profileId:
                  type: string
                  example: '135835135385'
                billfirm:
                  type: string
                  example: WEBG
                newPackage:
                  type: string
                  example: WEBG_WSB_Premium
              type: object
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteBuilderUpgradeResponse'
        400:
          $ref: '#/components/responses/Error'
      security:
        bearerAuth: []
  /wsb-upgrade/info:
    post:
      tags:
        - 'WebsiteBuilder Upgrade'
      summary: 'Get information about WSB profle'
      description: "Endpoint for retrieving information about WSB profile.<br><br>\n<b>Required Fields:</b>\n<ul>\n    <li><b>profileId:</b> Identifier of the WSB profile</li>\n    <li><b>billfirm:</b> Company identifier under which the WSB profile should be searched for</li>\n</ul>\n<br>\n<b>Note:</b> The system verifies if the provided profileId exists under the specified billfirm."

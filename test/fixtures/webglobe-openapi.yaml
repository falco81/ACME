      security:
        -
          bearerAuth: []
    put:
      tags:
        - Invoices
      summary: 'Pay with credit or change billing profile'
      description: 'Pays a proforma invoice with credit ("use_credit"=any value, or action="use_credit"), or sets/resets its billing profile (action="set_bill_profile"). Only applies to proforma invoices not yet paid/awaiting/trashed/checked and without an "ordercredit" flag.'
      operationId: invoices.update
      parameters:
        -
          name: invoice
          in: path
          description: 'Proforma invoice ID'
          required: true
          schema:
            type: integer
            example: 12345
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                -
                  description: 'Pay proforma invoice with credit'
                  properties:
                    use_credit:
                      description: 'Any value - pays the invoice using account credit'
                      type: string
                      example: '1'
                  type: object
                -
                  description: 'Set an existing billing profile, or reset to customer default data with IDbillprofile=-1'
                  properties:
                    action:
                      type: string
                      enum:
                        - set_bill_profile
                    IDbillprofile:
                      description: "Billing profile ID to apply, or -1 to reset the invoice to the customer's current default data"
                      type: integer
                      example: 42
                  type: object
                -
                  description: 'Create a new billing profile and apply it to the invoice'
                  properties:
                    action:
                      type: string
                      enum:
                        - set_bill_profile
                    new_bill_data:
                      properties:
                        customer_name:
                          type: string
                          example: 'John Doe'
                        customer_street:
                          type: string
                          example: 'Main 1'
                        customer_town:
                          type: string
                          example: Bratislava
                        customer_postcode:
                          type: string
                          example: '81101'
                        customer_state:
                          type: string
                          example: SK
                        customer_province:
                          type: string
                          nullable: true
                        customer_ico:
                          type: string
                          example: '12345678'
                          nullable: true
                        customer_dic:
                          type: string
                          example: '1234567890'
                          nullable: true
                        customer_icdph:
                          type: string
                          example: SK1234567890
                          nullable: true
                        customer_post_name:
                          type: string
                          nullable: true
                        customer_post_street:
                          type: string
                          nullable: true
                        customer_post_town:
                          type: string
                          nullable: true
                        customer_post_postcode:
                          type: string
                          nullable: true
                        customer_post_state:
                          type: string
                          nullable: true
                        customer_post_province:
                          type: string
                          nullable: true
                        customer_email:
                          type: string
                          format: email
                          nullable: true
                        customer_phone:
                          type: string
                          nullable: true
                      type: object
                  type: object
            examples:
              use_credit:
                summary: 'Pay with credit'
                value: '{"use_credit": "1"}'
              set_bill_profile_existing:
                summary: 'Set billing profile - existing profile'
                value: '{"action": "set_bill_profile", "IDbillprofile": 42}'
              set_bill_profile_reset:
                summary: 'Set billing profile - reset to customer default data'
                value: '{"action": "set_bill_profile", "IDbillprofile": -1}'
              set_bill_profile_new:
                summary: 'Set billing profile - create new profile'
                value: '{"action": "set_bill_profile", "new_bill_data": {"customer_name": "John Doe", "customer_street": "Main 1", "customer_town": "Bratislava", "customer_postcode": "81101", "customer_state": "SK", "customer_ico": "12345678", "customer_dic": "1234567890", "customer_icdph": "SK1234567890"}}'
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []

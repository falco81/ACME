  '/services/service/{service}':
    get:
      tags:
        - Services
      summary: 'Get service detail (not implemented)'
      description: 'Not implemented. The route exists but the method body is empty, so any request is accepted and no action is taken; the response has no content.'
      operationId: service.show
      parameters:
        -
          name: service
          in: path
          description: 'Service order ID (IDobjednanejSl)'
          required: true
          schema:
            type: integer
            example: 123456
      responses:

              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: OK
                  data:
                    description: 'Pinned domains keyed by domain ID, value is the decoded domain name'
                    type: object
                  data2:
                    type: array
                    items:
                      properties:
                        domain:
                          type: string
                          example: example.sk
                        domain_id:
                          type: integer
                          example: 12345
                        alt_name:
                          type: string
                          nullable: true
                      type: object
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/{domainId}/set-altname':
    post:
      tags:
        - Domains
      summary: 'Set domain alternative name'
      description: 'Sets or clears the alternative display name of a multihosting/server domain (name is limited to 20 characters). Only allowed for domains whose name ends with "_multihost" or starts with "multi_", or whose object_type is SERVER. For VPS packages, also propagates the name to the external service.'
      operationId: domains.setAltName
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'New alternative name, empty/omitted clears it'
                  type: string
                  example: 'My server'
                  maxLength: 20
              type: object
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/domain/{domainId}/list-contacts':
    get:
      tags:
        - Domains
      summary: 'List domain registry contacts'
      description: "Returns the domain's admin/tech contact handles from the registry (via the wgTLD SOAP client), grouped by contact type, together with any pending DOMAIN_CONTACT_UPDATE todo. Not supported for domains registered outside sknic/joker/czzoner/eurid/subreg/rrpproxy/cznic."
      operationId: domains.getContacts
      parameters:
        -
          $ref: '#/components/parameters/domainId'
        -
          name: with_contact_info
          in: query
          description: 'When present, also fetch full contact details for each handle'
          schema:
            type: string
      responses:
        200:
          description: 'Domain registry contacts'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  exist_change_idtodo:
                    description: 'ID of the pending contact-update todo, if any'
                    type: integer
                    nullable: true
                  todo_params:
                    type: object
                    nullable: true
                  contacts:
                    description: 'Contacts keyed by contact type (e.g. ADMIN, TECH)'
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        properties:
                          nic_id:
                            type: string
                            example: WEBG-0001
                          idcontact:
                            type: integer
                            nullable: true
                          contact_info:
                            description: 'Only present when with_contact_info is set'
                            type: object
                            nullable: true
                        type: object
                type: object
        400:
          $ref: '#/components/responses/Error'
      security:
        -
          bearerAuth: []
  '/domain/{domainId}/cancel-authorisation':
    post:
      tags:
        - Domains
      summary: 'Cancel pending contact-change authorisation'
      description: 'Cancels any pending DOMAIN_CONTACT_UPDATE authorisation todos for the domain.'
      operationId: domains.cancelAuthorisation
      parameters:
        -
          $ref: '#/components/parameters/domainId'
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/Error'

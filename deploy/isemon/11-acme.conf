# /etc/rsyslog.d/11-acme.conf - ON THE ISEMON MACHINE, not on the acme server.
#
# acme sends one kind of line: an event of the certificate manager, one a line,
# key=value fields, from the program "acme-certs":
#
#   acme-certs[812]: level=warn kind=certificates node=acme1 cert=web1 ... words="..."
#
# (renewed, failed, deployed, expiring, a CA's CRL, a portal request...). With
# isemon_events = 1 the platform's other events come as acme-certs lines too.
#
# This files them into the folder named after the host that sent them, as the
# file named after the program:
#
#   /var/log/remote/acme/acme-certs.log
#
# "acme" is what acme calls itself unless its setting isemon_hostname says
# otherwise; a second acme server can call itself acmesec.
#
# After copying:  rsyslogd -N1 && systemctl restart rsyslog

template(name="AcmeFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

if ($programname == "acme-certs") then {
    action(type="omfile" dynaFile="AcmeFile"
           dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="root" dirGroup="isemon"
           fileOwner="root" fileGroup="isemon")
    stop
}

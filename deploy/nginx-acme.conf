# /etc/nginx/conf.d/acme.conf
#
# acme's pages, over TLS, and the CAs' HTTP-01 challenges on port 80:
#
#   https://acme.example.local/admin/   the administration pages
#   https://acme.example.local/         the portal page
#   http://ANY-NAME/.well-known/acme-challenge/TOKEN
#                                       answered by acme.php from acme's
#                                       database (whichever node the CA reaches)
#   http://ANY-NAME/pki/                the CRLs and certificates of acme's own
#                                       authorities (pki.php), for everybody,
#                                       plain HTTP - never sent to HTTPS
#
# The pages are PHP that only relays to the acme daemon on 127.0.0.1:9861, run
# in a php-fpm pool of acme's own. Everything else here is a file (the style,
# the scripts, the languages) or refused.
#
# HTTP-01 for names other than this host's: the CA asks http://NAME/ for each
# name on the certificate, so those names must reach this server block - make
# it the default one on port 80 (`listen 80 default_server;`, with any other
# default_server on 80 removed, e.g. Debian's sites-enabled/default), or list
# the names in server_name.
#
# Who may reach which: the administration pages are for your own networks;
# install.sh writes the two lists below from --admin-allow and --portal-allow.

# Signing in is limited per address: a wrong password costs time. The whole
# query string is looked at, not $arg_api: that one takes the first of two
# api= and never decodes %61pi, and the page refuses both spellings anyway.
map $args $acme_login_key {
    "~(^|&)api=login(&|$)"   $binary_remote_addr;
    default                  "";
}
limit_req_zone $acme_login_key zone=acme_login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=acme_all:10m rate=10r/s;

server {
    listen      80;
    listen      [::]:80;
    server_name acme.example.local;            # <- your hostname
    server_tokens off;
    # A certificate by ACME: the CA's HTTP-01 challenge answered on
    # port 80 by acme.php - the answer is in acme's database, so whichever node
    # the CA reaches gives it. Everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        limit_req     zone=acme_all burst=20 nodelay;
        fastcgi_pass  unix:/run/php-fpm/acme.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/acme/acme.php;
        include       fastcgi_params;
        fastcgi_read_timeout 10s;
    }
    # The CRLs and certificates of acme's own authorities (docs/own-ca.md):
    # for everybody, plain HTTP - a CRL fetcher seldom follows a redirect to
    # HTTPS. From acme's database, so every node and the VIP address alike.
    # PKI-BEGIN
    location = /pki { return 301 /pki/; }
    location ^~ /pki/ {
        limit_req     zone=acme_all burst=40 nodelay;
        limit_req_status 429;
        fastcgi_pass  unix:/run/php-fpm/acme.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/acme/pki.php;
        include       fastcgi_params;
        fastcgi_read_timeout 15s;
    }
    # PKI-END
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line is the old spelling (nginx 1.25.1 has
    # `http2 on;` instead) - kept, because what AlmaLinux 9 and Ubuntu 24.04
    # ship is older than that and does not know the new one.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name acme.example.local;            # <- your hostname

    root  /var/www/acme;
    index index.php;
    server_tokens off;

    access_log /var/log/nginx/acme-access.log;
    error_log  /var/log/nginx/acme-error.log;

    ssl_certificate           /etc/nginx/certs/acme.pem;
    ssl_certificate_key       /etc/nginx/certs/acme.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:ACME:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # No Content-Security-Policy here: the pages send their own, with a nonce
    # made for each page, and a browser given two enforces both - so a second
    # one from nginx could only be looser than the page's (and so worthless)
    # or tighter (and so break it). The files under /assets/ are not pages.

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Every request either page sends is a few kilobytes of JSON.
    client_max_body_size 8m;
    client_body_timeout  60s;

    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    # php2shell (CVE-2026-109618, CVE-2026-109619): nothing on acme's pages sends
    # a multipart body, and PHP takes one apart before any page runs.
    if ($http_content_type ~* "multipart") { return 403; }

    # ---- the portal page ---------------------------------------------------------
    location = / {
        # PORTAL-ALLOW-BEGIN
        allow 192.168.0.0/16;         # <- who may reach the portal
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # PORTAL-ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        limit_req zone=acme_login burst=10 nodelay;
        limit_req zone=acme_all   burst=40 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/acme.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 120s;
    }
    location = /index.php { return 301 /; }

    # ---- the administration pages -------------------------------------------
    location = /admin { return 301 /admin/; }
    location = /admin/ {
        # ADMIN-ALLOW-BEGIN
        allow 192.168.0.0/16;         # <- your own networks
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # ADMIN-ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        limit_req zone=acme_login burst=10 nodelay;
        limit_req zone=acme_all   burst=60 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/acme.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/admin/index.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        # Putting a copy of the database back is the whole of what acme has
        # recorded: the file itself is the body (never a multipart form).
        # Only here, behind the administrators' allow list; the page refuses
        # anything else this big. nginx takes the whole body before PHP is
        # asked (1.0.61): handed on as it arrived, thirteen slow requests of
        # anybody's held every PHP worker for up to 15 minutes - the pages
        # and the health check with them.
        client_max_body_size 4g;
        client_body_timeout  60s;
        fastcgi_request_buffering on;
        fastcgi_read_timeout 900s;
    }

    # ---- the load balancer's question: does this node answer? (1.0.13) ----
    # 200 "ok NODE" when the daemon answers and its database opens, 503 when
    # not. Says nothing else, so anybody may ask.
    location = /healthz {
        limit_req zone=acme_all burst=10 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/acme.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/healthz.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 10s;
        access_log off;
    }

    # ---- Prometheus (1.0.173): each node's metrics, with the scraper's token ----
    location = /metrics {
        limit_req zone=acme_all burst=10 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/acme.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/metrics.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 15s;
        access_log off;
    }

    # ---- the CRLs and certificates of acme's own authorities (docs/own-ca.md) ----
    # The same as on port 80, for everybody: public objects only.
    # PKI-BEGIN
    location = /pki { return 301 /pki/; }
    location ^~ /pki/ {
        limit_req zone=acme_all burst=40 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/acme.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/pki.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 15s;
    }
    # PKI-END

    # ---- files ------------------------------------------------------------------
    location /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico { return 301 /assets/favicon.svg; }

    # Nothing else: no other PHP file answers when asked by name (the two that
    # are included, acme-api.php and acme-page.php, among them), no language
    # file, no dot file.
    location ~ \.php$ { return 404; }
    location /lang/   { return 404; }
    location ~ /\.    { deny all; }
    location /        { return 404; }
}
